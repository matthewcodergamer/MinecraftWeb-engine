  #boot pre { color: #fff; background: rgba(150,20,20,.95); border: 2px solid #ff5555; border-radius: 4px;
    padding: 10px 12px; margin: 14px 0 0; max-width: min(720px, 92vw); max-height: 42vh; overflow: auto;

  html.embedded #boot { display: none !important; }

  html.embedded, html.embedded body { background: #000; }

    z-index: 5; pointer-events: none; }
  /* Small Buy Me a Coffee badge, shown only while Java's TitleScreen is up. */

  #bmc:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.05); }
  #bmc img { width: 28px; height: 28px; display: block; }

<body>
<a id="bmc" href="https://buymeacoffee.com/gamerstripd" target="_blank" rel="noopener"
   aria-label="Buy me a coffee" title="Buy me a coffee"><img src="ui/bmc.svg" alt=""></a>
<script>
  // The badge belongs to the home screen, not the world HUD. Java publishes
  // its current screen in __mc['boot-state']; keep the icon only on TitleScreen.
  (function () {
    var badge = document.getElementById('bmc');
    var title = 'screen=net.minecraft.client.gui.screens.TitleScreen';
    function syncBadge() {
      var boot = String((window.__mc && window.__mc['boot-state']) || '');
      badge.hidden = boot.indexOf(title) < 0;
    }
    syncBadge();
    setInterval(syncBadge, 500);
  })();
</script>
<div id="boot"><div id="boot-msg">Starting…</div><div class="bar"><div id="boot-bar"></div></div><pre id="boot-err"></pre></div>
<div id="stats"></div>
<script src="native/layout.js?v=20261124b"></script>
<script src="native/layout-shaders.js?v=20261124b"></script>
<script src="native/heap.js?v=20261124b"></script>
<script src="native/natives.js?v=20261124b"></script>
<script src="native/sdl.js?v=20261124b"></script>
<script src="native/shaders.js?v=20261124b"></script>
<script src="native/stb.js?v=20261124b"></script>
<script src="gpu/webgpu.js?v=20261124b"></script>
<script src="bridge.js"></script>
<script>
// Host page of the browser port: loads the client jar's resources (packed from the user's own installation),
// initialises the WebAssembly shader toolchain and the WebGPU device, then starts the real
// net.minecraft.client.main.Main compiled by TeaVM (clientmain.js).
'use strict';
const params = new URLSearchParams(location.search);
const embedded = params.get('embedded') === '1';
// All game parts live on the Hugging Face Space. The same files are also
// available next to this page, which is used as an offline fallback.
const HF_BASE = 'https://matthewcodergamer-minecraft-browser.static.hf.space/';
// Bumped on every deployed client build. The Space CDN caches the module and
// its runtime for a long time, so an unversioned URL can keep serving an old
// wasm build after a deployment.
const MC_BUILD = '20261125d';
// Cache Storage bucket for the two large client artifacts. bridge.js adds the
// `mc-client-` prefix; bumping MC_BUILD changes the bucket, so a new client
// never runs against stale bytes.
const CLIENT_CACHE = MC_BUILD;
if (embedded) document.documentElement.classList.add('embedded');
if (window.mcBridge && mcBridge.configureAssetCache) mcBridge.configureAssetCache(CLIENT_CACHE);

// World handshake with the page that owns the menus. Java's ChunkBridge reads
// these globals when the title screen is idle, so the host can apply the name,
// seed, mode, difficulty and toggles from the Create/Select World screens.
window.__mcWorldAuto = !embedded && params.get('world') !== '0';
window.__mcWorldRequested = null;
// Set by the owning page when the player imports a saves folder. The manifest
// lists every file the host stored in IndexedDB (`mc-world-files`); the Java
// side can stream those same entries and run DataFixerUpper on old formats.
window.__mcWorldImport = null;
if (params.has('name') || params.has('seed') || params.has('mode')) {
  window.__mcWorldRequested = {
    name: params.get('name') || 'World',
    seed: params.get('seed') || '',
    mode: params.get('mode') || 'survival',
    difficulty: params.get('difficulty') || 'normal',
    type: params.get('type') || 'normal',
    commands: params.get('commands') === '1',
    structures: params.get('structures') !== '0',
    bonus: params.get('bonus') === '1',
  };
}
function ackWorld(type) {
  // Tell the owning page the brain has the settings and will start generating.
  if (window.parent === window) return;
  try {
    window.parent.postMessage({
      source: 'mc-brain',
      type: 'world-ack',
      request: type,
      world: window.__mcWorldRequested || null,
    }, '*');
  } catch (e) { /* ignore */ }
}
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.source !== 'mc-host') return;
  if (data.type === 'world-play' || data.type === 'world-create' || data.type === 'world-edit') {
    window.__mcWorldRequested = data.world || {};
    window.__mcWorldAuto = true;
    window.__mcWorldImport = null;
    ackWorld(data.type);
  } else if (data.type === 'world-import') {
    // Let the Java layer pick up the world metadata and the stored manifest.
    window.__mcWorldRequested = data.world || {};
    window.__mcWorldImport = {
      world: data.world || {},
      manifest: Array.isArray(data.manifest) ? data.manifest : [],
      store: 'mc-world-files',
      id: (data.world && data.world.id) || null,
    };
    window.__mcWorldAuto = false;
    ackWorld(data.type);
  } else if (data.type === 'world-stop') {
    window.__mcWorldRequested = null;
    window.__mcWorldImport = null;
    window.__mcWorldAuto = false;
  }
});

let progressLabel = 'Starting WebAssembly client...';
const msg = (t) => {
  progressLabel = t;
  const el = document.getElementById('boot-msg');
  if (el) el.textContent = t;
  if (window.mcBridge) mcBridge.setProgress(window.__mcProgress || 0, t);
};
let barValue = 0;
const bar = (f) => {
  // Two independent downloads report progress; never let one drag the bar
  // backwards when the other finishes first.
  barValue = Math.max(barValue, f);
  window.__mcProgress = barValue;
  const el = document.getElementById('boot-bar');
  if (el) el.style.width = Math.round(barValue * 100) + '%';
  if (window.mcBridge) mcBridge.setProgress(barValue, progressLabel);
};
const fail = (t) => {
  // The Java client can report a fatal error more than once (crash report +
  // shutdown path); keep the first message instead of stacking duplicates.
  if (window.__mc && window.__mc.failedShown) return;
  const el = document.getElementById('boot-err');
  if (el) {
    el.textContent += t + '\n';
    el.classList.add('show');
  }
  const boot = document.getElementById('boot');
  if (boot) boot.style.display = 'flex';
  window.__mc = Object.assign(window.__mc || {}, { stage: 'failed', error: t, failedShown: true });
  if (window.mcBridge) mcBridge.javaError(t);
};
Error.stackTraceLimit = 100;
// Fiber/monitor tracing is useful while debugging the runtime but emits
// thousands of CDP console events and slows world creation. Keep it opt-in.
window.__mcVerbose = /[?&]verbose=1/.test(location.search);
window.__mcLog = (lvl, text) => console.log('[' + lvl + '] ' + text);
window.__mcExit = (status) => {
  msg('Minecraft exited (' + status + ')');
  const boot = document.getElementById('boot');
  if (boot) boot.style.display = 'flex';
  if (window.mcBridge && status) mcBridge.javaError('Minecraft exited (' + status + ')');
};
window.addEventListener('error', (e) => fail('ERROR: ' + e.message));
window.addEventListener('unhandledrejection', (e) => {
  // Browsers reject pointer lock in iframes, without a user gesture, or when
  // the document lost focus. The client is fully playable without it, so a
  // lock rejection must not be classified as a fatal Java crash.
  const text = String((e.reason && (e.reason.name + ': ' + e.reason.message)) || e.reason || '');
  if (/pointer\s*lock|user activation|document is not focused/i.test(text)) {
    console.warn('Ignoring non-fatal pointer lock rejection: ' + text);
    e.preventDefault();
    return;
  }
  fail('REJECTION: ' + (e.reason && e.reason.stack || e.reason));
});

/* The two artifacts download in parallel on desktop. Weight their progress by
   real size so the bar follows total bytes instead of jumping backwards when
   the smaller archive finishes first. */
const DL_WEIGHT_ASSETS = 64.7;
const DL_WEIGHT_WASM = 111.9;
const downloadState = { assets: 0, wasm: 0 };
function downloadBar(kind, fraction) {
  downloadState[kind] = Math.max(downloadState[kind] || 0, Math.max(0, Math.min(1, fraction || 0)));
  const total = DL_WEIGHT_ASSETS + DL_WEIGHT_WASM;
  const combined = (downloadState.assets * DL_WEIGHT_ASSETS
    + downloadState.wasm * DL_WEIGHT_WASM) / total;
  bar(0.95 * combined);
}

async function fetchWithProgress(url, label, from, to, useCache) {
  // Shared with the host page: ./-relative, range-chunked, resumable. iOS
  // Safari cannot survive a single 31 MB arrayBuffer() when backgrounded.
  // Absolute URLs are used by the GitHub Pages shell, which keeps the large
  // WASM/resource artifacts on the canonical Hugging Face Space.
  const target = /^https?:\/\//i.test(url) ? url : './' + url;
  return mcBridge.fetchAsset(target, {
    retries: 2,
    cacheName: useCache ? CLIENT_CACHE : null,
    contentType: 'application/octet-stream',
    onProgress: (fraction, got, total) => {
      const mb = (n) => (n / 1048576).toFixed(0);
      msg(label + ' ' + mb(got) + ' / ' + mb(total || got) + ' MiB');
      downloadBar('assets', fraction);
    },
    onCacheHit: (bytes) => {
      msg(label + ' — loaded from this device (' + (bytes / 1048576).toFixed(0) + ' MiB, no download)');
      downloadBar('assets', 1);
    },
    onCached: () => {
      msg(label + ' — saved on this device for the next visit');
    },
  });
}

function reportBootStage(stage, detail) {
  const t = Math.round(performance.now());
  const payload = { source: 'mc-brain', type: 'java-stage', stage, detail: detail || '', t };
  console.log('[TEAVM_BOOT] t=' + t + ' ' + stage + (detail ? ' ' + detail : ''));
  if (window.parent !== window) window.parent.postMessage(payload, '*');
}

function loadClassicScript(src) {
  return new Promise((res, rej) => {
    reportBootStage('client-script-load-start', src.startsWith('blob:') ? 'blob-url' : src);
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => {
      reportBootStage('client-script-load-complete');
      res();
    };
    s.onerror = () => {
      reportBootStage('client-script-load-error', s.src);
      rej(new Error('failed to load ' + s.src));
    };
    document.body.appendChild(s);
  });
}

async function timedFetch(url, options, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 45000);
  try {
    return await fetch(url, Object.assign({ cache: 'no-store' }, options || {}, { signal: ctrl.signal }));
  } catch (e) {
    const err = new Error((e.name === 'AbortError'
      ? 'timed out after ' + Math.round((ms || 45000) / 1000) + 's'
      : e.name + ': ' + e.message) + ' — ' + url);
    err.url = url;
    err.kind = 'network';
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// Reads one part straight off the response body so the progress bar follows
// the real bytes received (ReadableStream), not a timer.
async function downloadPart(url, expected, onBytes) {
  const res = await timedFetch(url, {}, 60000);
  if (!res.ok) {
    const err = new Error('HTTP ' + res.status + ' ' + res.statusText + ' — ' + url);
    err.status = res.status;
    err.url = url;
    err.kind = 'http';
    throw err;
  }
  const chunks = [];
  let received = 0;
  if (res.body && res.body.getReader) {
    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      onBytes && onBytes(value.length, received);
    }
  } else {
    const view = new Uint8Array(await res.arrayBuffer());
    chunks.push(view);
    received = view.length;
    onBytes && onBytes(received, received);
  }
  if (expected && received !== expected) {
    console.warn('part size mismatch: expected ' + expected + ', got ' + received + ' — ' + url);
  }
  return chunks;
}

/* Mobile browsers are killed while a 112 MiB wasm file sits in a JavaScript
   ArrayBuffer, then again when it is copied into a Blob. Stream the bytes to
   the Origin Private File System instead and compile straight from the
   disk-backed File. On the next visit the same file is reused with no
   download. Cache Storage remains the fallback for browsers without OPFS. */
const WASM_CACHE_DIR = 'mc-client';
const WASM_CACHE_KEY = 'client-' + String(MC_BUILD).replace(/[^a-zA-Z0-9._-]/g, '') + '.wasm';
let wasmCacheDirPromise = null;

function wasmCacheDir() {
  if (wasmCacheDirPromise) return wasmCacheDirPromise;
  wasmCacheDirPromise = (async () => {
    if (!navigator.storage || typeof navigator.storage.getDirectory !== 'function') return null;
    try {
      const root = await navigator.storage.getDirectory();
      return await root.getDirectoryHandle(WASM_CACHE_DIR, { create: true });
    } catch (error) {
      console.warn('OPFS wasm cache unavailable', error);
      return null;
    }
  })();
  return wasmCacheDirPromise;
}

async function readWasmCache(dir) {
  if (!dir) return null;
  try {
    const metaFile = await (await dir.getFileHandle(WASM_CACHE_KEY + '.json')).getFile();
    const meta = JSON.parse(await metaFile.text());
    const file = await (await dir.getFileHandle(WASM_CACHE_KEY)).getFile();
    if (file.size > 0 && (!meta.size || Number(meta.size) === file.size)) return file;
    console.warn('OPFS wasm cache size mismatch', meta.size, file.size);
  } catch (error) {
    /* A missing meta or a partial first download: fall through and refetch. */
  }
  return null;
}

async function writeWasmCacheMeta(dir, file) {
  try {
    const handle = await dir.getFileHandle(WASM_CACHE_KEY + '.json', { create: true });
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify({ build: MC_BUILD, size: file.size, saved: Date.now() }));
    await writable.close();
  } catch (error) {
    console.warn('OPFS wasm cache metadata not saved', error);
  }
}

async function downloadWasmToCache(absolute, dir, onProgress) {
  const response = await fetch(absolute, {
    cache: 'no-store',
    headers: { Range: 'bytes=0-' },
  });
  if (!response.ok) throw new Error('HTTP ' + response.status + ' — ' + absolute);
  if (!response.body || !response.body.getReader) throw new Error('streaming download unavailable');
  const total = Number(response.headers.get('content-length')) || 0;
  const handle = await dir.getFileHandle(WASM_CACHE_KEY, { create: true });
  const writable = await handle.createWritable();
  const reader = response.body.getReader();
  let got = 0;
  try {
    for (;;) {
      const step = await reader.read();
      if (step.done) break;
      await writable.write(step.value);
      got += step.value.length;
      onProgress(total ? Math.min(1, got / total) : 0, got, total);
    }
    await writable.close();
  } catch (error) {
    try { await writable.abort(); } catch (e) { /* already closed */ }
    throw error;
  }
  const file = await handle.getFile();
  if (total && file.size !== total) {
    throw new Error('wasm download truncated (' + file.size + ' of ' + total + ' bytes)');
  }
  await writeWasmCacheMeta(dir, file);
  return file;
}

async function compileWasmFile(file, absolute, options) {
  const blobUrl = URL.createObjectURL(new Blob([file], { type: 'application/wasm' }));
  try {
    msg('Compiling WebAssembly client…');
    return await TeaVM.wasmGC.load(blobUrl, options);
  } catch (error) {
    console.warn('cached wasm blob load failed; loading the URL directly', error);
    return await TeaVM.wasmGC.load(absolute, options);
  } finally {
    URL.revokeObjectURL(blobUrl);
  }
}

/* Download the wasm ourselves so the progress bar follows real bytes, then
   compile it from a Blob URL. Cache Storage keeps the finished bytes for the
   next visit; the HF signed CDN URL changes every time, so the HTTP cache
   cannot do that on its own. */
async function loadWasmModule(url, options) {
  const absolute = new URL(url, location.href).href;
  const mb = (n) => (n / 1048576).toFixed(0);
  const dir = params.get('nocache') === '1' ? null : await wasmCacheDir();
  if (dir) {
    const cached = await readWasmCache(dir);
    if (cached) {
      msg('WebAssembly client loaded from this device (' + mb(cached.size) + ' MiB, no download)');
      downloadBar('wasm', 1);
      return await compileWasmFile(cached, absolute, options);
    }
    try {
      msg('Downloading WebAssembly client…');
      const file = await downloadWasmToCache(absolute, dir, (fraction, got, total) => {
        msg('Downloading WebAssembly client ' + mb(got) + ' / ' + mb(total || got) + ' MiB');
        downloadBar('wasm', fraction);
      });
      msg('WebAssembly client saved on this device for the next visit');
      return await compileWasmFile(file, absolute, options);
    } catch (error) {
      console.warn('OPFS wasm download failed; falling back to Cache Storage', error);
      msg('Retrying the WebAssembly client download…');
    }
  }
  const buffer = await mcBridge.fetchAsset(absolute, {
    retries: 1,
    cacheName: CLIENT_CACHE,
    contentType: 'application/wasm',
    onProgress: (fraction, got, total) => {
      msg('Downloading WebAssembly client ' + mb(got) + ' / ' + mb(total || got) + ' MiB');
      downloadBar('wasm', fraction);
    },
    onCacheHit: (bytes) => {
      msg('WebAssembly client loaded from this device (' + mb(bytes) + ' MiB, no download)');
      downloadBar('wasm', 1);
    },
    onCached: () => msg('WebAssembly client saved on this device for the next visit'),
  });
  const blobUrl = URL.createObjectURL(new Blob([buffer], { type: 'application/wasm' }));
  try {
    msg('Compiling WebAssembly client…');
    return await TeaVM.wasmGC.load(blobUrl, options);
  } catch (blobError) {
    // A browser that refuses blob: streaming still gets the real module.
    console.warn('blob wasm load failed; loading the URL directly', blobError);
    return await TeaVM.wasmGC.load(absolute, options);
  } finally {
    URL.revokeObjectURL(blobUrl);
  }
}

async function loadWasmBrain() {
  // The Hugging Face Space serves the module next to this page. The GitHub
  // Pages shell intentionally keeps only the lightweight HTML/JS host and
  // loads the same module from the canonical Space, so both URLs always run
  // the exact same Java build instead of drifting copies.
  //
  // A module served from a local web server (how CI runs the smoke tests) is
  // the build under test. Never replace it with the deployed Space build: a
  // stale remote module made an uncompilable local build look like it had
  // booted all the way to world generation.
  const localHost = location.hostname === '127.0.0.1'
    || location.hostname === 'localhost'
    || location.hostname === '::1'
    || location.hostname === '[::1]';
  const mustUseLocalBuild = localHost || params.get('wasm') === '1';
  try {
    await loadClassicScript('minecraft-java-edition-v26.3.wasm-runtime.js?v=' + MC_BUILD);
  } catch (error) {
    if (mustUseLocalBuild) throw error;
    console.warn('local WASM runtime unavailable; loading the canonical runtime', error);
    await loadClassicScript(HF_BASE + 'minecraft-java-edition-v26.3.wasm-runtime.js?v=' + MC_BUILD);
  }
  if (!window.TeaVM || !TeaVM.wasmGC || typeof TeaVM.wasmGC.load !== 'function') {
    throw new Error('TeaVM Wasm GC runtime did not expose TeaVM.wasmGC.load');
  }
  const options = {
    installImports(imports) {
      imports.mcHeap = {
        heapView(addr, len) {
          const heap = globalThis.__mcHeap;
          if (!heap || !heap.buffer) throw new Error('mcHeap buffer is not initialized');
          return new Int8Array(heap.buffer, addr, len);
        },
        isHeapView(view) {
          const heap = globalThis.__mcHeap;
          return !!(heap && heap.buffer && view && view.buffer === heap.buffer);
        },
      };
    },
  };
  let teavm;
  try {
    teavm = await loadWasmModule('minecraft-java-edition-v26.3.wasm?v=' + MC_BUILD, options);
    window.__mcWasmUrl = new URL('minecraft-java-edition-v26.3.wasm?v=' + MC_BUILD, location.href).href;
  } catch (localError) {
    if (mustUseLocalBuild || location.hostname.endsWith('.hf.space')) throw localError;
    console.warn('local WASM module unavailable; loading the canonical module', localError);
    teavm = await loadWasmModule(HF_BASE + 'minecraft-java-edition-v26.3.wasm?v=' + MC_BUILD, options);
    window.__mcWasmUrl = HF_BASE + 'minecraft-java-edition-v26.3.wasm?v=' + MC_BUILD;
  }
  window.__mcTeaVM = teavm;
  window.__mcRunMain = () => teavm.exports.main([]);
  window.__mcEngine = 'wasm';
  reportBootStage('wasm-gc-module-instantiated');
}

async function loadBrain() {
  reportBootStage('client-bundle-load-enter');
  // WebAssembly is the primary engine: the module compiles once and avoids the
  // ~266 MiB JavaScript bundle, which is what exhausts mobile browser memory.
  // The split JavaScript client remains as a fallback for browsers without
  // Wasm GC (or when the WASM files are not deployed).
  const forceWasm = params.get('wasm') === '1';
  const forceJs = params.get('wasm') === '0' || params.has('js');
  if (!forceJs) {
    try {
      await loadWasmBrain();
      return;
    } catch (error) {
      if (forceWasm) throw error;
      console.warn('WebAssembly client unavailable; falling back to JavaScript: ' +
        (error && error.message ? error.message : error));
      reportBootStage('wasm-gc-fallback', error && error.message ? error.message : String(error));
      try { delete window.TeaVM; } catch (e) { /* ignore */ }
      window.__mcTeaVM = null;
      window.__mcRunMain = null;
      window.__mcEngine = 'js';
    }
  } else {
    window.__mcEngine = 'js';
  }
  const explicit = params.get('js');
  if (explicit && explicit !== '1') {
    await loadClassicScript(explicit + '.js');
    return;
  }
  // GitHub Pages caps a single file at 100 MB, so the ~266 MiB TeaVM bundle
  // ships as parts and is reassembled here. Falls back to a single script.
  let manifest = null;
  let manifestBase = './';
  for (const base of [HF_BASE, './']) {
    try {
      const r = await timedFetch(base + 'clientmain.parts.json', {}, 15000);
      if (r.ok) { manifest = await r.json(); manifestBase = base; break; }
    } catch (e) { console.warn('manifest ' + base + ' failed', e); }
  }
  if (!manifest || !Array.isArray(manifest.parts) || !manifest.parts.length) {
    await loadClassicScript('clientmain.js');
    return;
  }
  const parts = manifest.parts.map((p) => typeof p === 'string' ? { name: p } : p);
  const downloadTotal = manifest.downloadTotal
    || parts.reduce((n, p) => n + (p.size || 0), 0);
  const rawTotal = manifest.total || downloadTotal;
  reportBootStage('client-bundle-manifest-ready',
    'compressed_bytes=' + downloadTotal + ' raw_bytes=' + rawTotal + ' parts=' + parts.length);
  const received = new Array(parts.length).fill(0);
  const buffers = new Array(parts.length);
  const mb = (n) => (n / 1048576).toFixed(1);
  const report = () => {
    const sum = received.reduce((a, b) => a + b, 0);
    bar(0.9 + 0.08 * (sum / (downloadTotal || 1)));
    msg('Downloading Java brain ' + mb(sum) + ' / ' + mb(downloadTotal) + ' MiB');
  };
  report();
  // Download the gzip parts in parallel, each with a ReadableStream reader so
  // progress is measured in received bytes. Hugging Face is the primary source;
  // the same-origin copy is a fallback.
  let next = 0;
  const worker = async () => {
    for (;;) {
      const i = next++;
      if (i >= parts.length) return;
      const name = parts[i].name;
      const expected = parts[i].size || 0;
      const sources = manifestBase === './' ? ['./'] : [manifestBase, './'];
      let lastError = null;
      let done = false;
      for (const base of sources) {
        try {
          buffers[i] = await downloadPart(base + name, expected, (n, got) => {
            received[i] = got;
            report();
          });
          done = true;
          break;
        } catch (e) {
          lastError = e;
          received[i] = 0;
          report();
          console.warn('part ' + name + ' from ' + base + ' failed', e);
        }
      }
      if (!done) throw lastError || new Error('failed to download ' + name);
      report();
    }
  };
  await Promise.all(Array.from({ length: Math.min(3, parts.length) }, worker));
  // buffers[i] is an array of stream chunks; flatten them into one Blob.
  const packed = new Blob([].concat.apply([], buffers));
  reportBootStage('client-bundle-download-complete', 'compressed_bytes=' + packed.size);
  let scriptData = packed;
  if (manifest.encoding === 'gzip') {
    if (typeof DecompressionStream !== 'function') {
      throw new Error('This browser cannot decompress the client bundle (no DecompressionStream gzip).');
    }
    msg('Extracting Java Brain…');
    reportBootStage('client-bundle-decompress-start');
    bar(0.985);
    const stream = packed.stream().pipeThrough(new DecompressionStream('gzip'));
    const reader = stream.getReader();
    const chunks = [];
    let extracted = 0;
    for (;;) {
      const step = await reader.read();
      if (step.done) break;
      chunks.push(step.value);
      extracted += step.value.length;
      if (rawTotal) {
        bar(Math.min(1, 0.985 + 0.015 * (extracted / rawTotal)));
        msg('Extracting Java Brain… ' + mb(extracted) + ' / ' + mb(rawTotal) + ' MiB');
      }
    }
    scriptData = new Blob(chunks, { type: 'text/javascript' });
    reportBootStage('client-bundle-decompress-complete', 'javascript_bytes=' + scriptData.size);
  }
  bar(1);
  msg('Starting Java client (WebAssembly)…');
  await loadClassicScript(URL.createObjectURL(scriptData));
}

async function loadResources() {
  // Prefer the copy next to the page (the Space and local dev server), then
  // fall back to the canonical Space for the GitHub Pages shell. The archive is
  // large, so it is deliberately not duplicated into the Pages repository.
  const sources = ['minecraft-java-edition-v26.3-assets.bin', HF_BASE + 'minecraft-java-edition-v26.3-assets.bin'];
  let buf = null;
  let lastError = null;
  for (const source of sources) {
    try {
      buf = await fetchWithProgress(source, 'Loading game resources', 0, 0.6, true);
      break;
    } catch (error) {
      lastError = error;
      console.warn('resource archive ' + source + ' failed', error);
    }
  }
  if (!buf) throw lastError || new Error('could not load minecraft-java-edition-v26.3-assets.bin');
  const dv = new DataView(buf);
  if (dv.getUint32(0, false) !== 0x4D435253) throw new Error('bad resource archive');
  const len = dv.getUint32(4, true);
  const index = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, len)));
  const base = 8 + len;
  for (const k in index) index[k][0] += base;
  const icuZoneInfo = Object.keys(index).find((name) =>
    name.startsWith('com/ibm/icu/impl/data/') && name.endsWith('/zoneinfo64.res'));
  if (!icuZoneInfo) {
    throw new Error('Minecraft resource archive is missing ICU4J zoneinfo64.res; rebuild with scripts/pack_resources.py');
  }
  console.log('[RESOURCE_PREFLIGHT] ICU4J timezone bundle present: ' + icuZoneInfo);
  window.__mcResources = { index, data: buf };
}

function showStats() {
  const el = document.getElementById('stats');
  if (params.get('stats') === '0') return;
  window.__mcOnFps = (fps) => {
    const G = window.__mcWebGPU, s = G && G.stats;
    el.textContent = fps.toFixed(0) + ' fps' + (s ? ' | ' + (G.device ? 'WebGPU' : 'WebGL2') + ' draws ' + s.draws : '');
    if (s) s.draws = 0;
  };
}

/**
 * Long-session diagnostics. Chrome's renderer can be killed for running out
 * of memory without raising a JS exception, so log heap and GPU resource
 * counts continuously; cdp.py's soak mode reads the same snapshot.
 */
function installMemoryWatch() {
  if (window.__mcMemWatch) return;
  const snapshot = () => {
    const F = window.__mcFrames || {};
    const G = window.__mcWebGPU;
    return {
      t: Math.round(performance.now()),
      fps: Math.round(F.fps || 0),
      workMs: +(F.workAvg || 0).toFixed(2),
      heapMB: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : -1,
      totalHeapMB: performance.memory ? Math.round(performance.memory.totalJSHeapSize / 1048576) : -1,
      gpu: G && G.snapshot ? G.snapshot() : null,
    };
  };
  window.__mcSnapshot = snapshot;
  window.__mcMemWatch = setInterval(() => {
    try { console.log('[MW_MEM] ' + JSON.stringify(snapshot())); } catch (e) { /* diagnostics must not break the game */ }
  }, 10000);
}

(async () => {
  try {
    msg('Loading game resources…');
    // The resource archive and the Java module are independent downloads.
    // Running them one after the other added their full wall-clock times; on a
    // desktop browser overlap them, while touch/low-memory devices keep the
    // sequential path so two large buffers never coexist in the tab.
    const deviceMemory = Number(navigator.deviceMemory) || 0;
    const touch = (navigator.maxTouchPoints || 0) > 1
      || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    const parallelBoot = !touch && (deviceMemory === 0 || deviceMemory > 4);
    const resourcesPromise = loadResources();
    resourcesPromise.catch(() => { /* reported by the await below */ });
    let brainPromise = null;
    if (parallelBoot) {
      brainPromise = loadBrain();
      brainPromise.catch(() => { /* reported by the await below */ });
    }
    msg('Starting shader compiler…');
    await __mcShaders.init('');
    msg('Starting graphics…');
    const webgpu = await __mcWebGPU.init();
    console.log(webgpu ? 'Graphics: WebGPU (' + __mcWebGPU.adapterName + ')' : 'Graphics: WebGPU unavailable, using WebGL2');
    if (!webgpu) {
      throw new Error('WebGPU could not start in this browser: ' + (__mcWebGPU.error || 'unknown reason') +
        '. Minecraft 26.3 needs WebGPU (Chrome 113+ or Safari 18+).');
    }
    await resourcesPromise;
    bar(0.75);
    msg('Loading Minecraft…');
    if (!brainPromise) brainPromise = loadBrain();
    await brainPromise;
    reportBootStage('client-bundle-script-executed');
    bar(1);
    showStats();
    installMemoryWatch();
    // The Minecraft window (the canvas) appears when the client creates it; hide the boot screen then.
    const waitCanvas = setInterval(() => {
      if (window.__mcSDL && __mcSDL.canvas && window.__mcWebGPU && __mcWebGPU.frame > 0) {
        document.getElementById('boot').style.display = 'none';
        clearInterval(waitCanvas);
      }
    }, 100);
    // Cooperative-fiber heartbeat: this runs on the browser event loop even while
    // the TeaVM main fiber is suspended. It records only stable, non-cyclic state.
    if (!window.__mcFiberHeartbeat) {
      let heartbeatTick = 0;
      window.__mcFiberHeartbeat = setInterval(() => {
        const mc = window.__mc || {};
        const teavm = window.__mcTeaVM;
        let exports = [];
        try { exports = teavm && teavm.exports ? Object.keys(teavm.exports).slice(0, 20) : []; } catch (_) {}
        console.log('[FIBER_HEARTBEAT] tick=' + (++heartbeatTick)
          + ' stage=' + (mc.stage || 'unset')
          + ' boot=' + (window.__mcBootStage || 'unset')
          + ' teavm=' + (!!teavm)
          + ' runMain=' + (typeof window.__mcRunMain)
          + ' exports=' + exports.join(','));
      }, 5000);
    }
    window.__mcBootStage = 'teavm-main-dispatch-enter';
    reportBootStage(window.__mcBootStage);
    if (typeof window.__mcRunMain === 'function') window.__mcRunMain();
    else main([]);
    window.__mcBootStage = 'teavm-main-dispatch-return';
    reportBootStage(window.__mcBootStage);
    // The Java client reports fatal startup errors by setting
    // window.__mc.stage = 'failed'. Mirror that on the boot screen (and in the
    // owning page) instead of leaving the player on "Starting Java client…".
    const watchJava = setInterval(() => {
      if (!window.__mc || window.__mc.stage !== 'failed') return;
      clearInterval(watchJava);
      fail(String(window.__mc.error || 'The Java client stopped while starting.'));
    }, 500);
  } catch (e) {
    fail(String(e && e.stack || e));
  }
})();
</script>
