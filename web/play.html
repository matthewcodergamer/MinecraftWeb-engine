<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="16x16" href="ui/icon_16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="ui/icon_32.png">
<title>Minecraft</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overflow-x: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #mc-canvas { position: fixed; inset: 0; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #ddd; font: 14px/1.5 system-ui, sans-serif; background: #1e1e1e; z-index: 10; }
  #boot .bar { width: min(420px, 80vw); height: 6px; background: #333; margin-top: 12px; }
  #boot .bar div { height: 100%; width: 0; background: #e8e8e8; transition: width .2s; }
  #boot pre { color: #fff; background: rgba(150,20,20,.95); border: 2px solid #ff5555; border-radius: 4px;
    padding: 10px 12px; margin: 14px 0 0; max-width: min(720px, 92vw); max-height: 42vh; overflow: auto;
    white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; display: none;
    box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #boot pre.show { display: block; }
  html.embedded #boot { display: none !important; }
  html.embedded #stats { display: none !important; }
  html.embedded, html.embedded body { background: #000; }
  #stats { position: fixed; right: 6px; top: 4px; color: #fff; font: 11px monospace; text-shadow: 1px 1px #000;
    z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<div id="boot"><div id="boot-msg">Starting…</div><div class="bar"><div id="boot-bar"></div></div><pre id="boot-err"></pre></div>
<div id="stats"></div>
<script src="native/layout.js"></script>
<script src="native/layout-shaders.js"></script>
<script src="native/heap.js"></script>
<script src="native/natives.js"></script>
<script src="native/sdl.js"></script>
<script src="native/shaders.js"></script>
<script src="native/stb.js"></script>
<script src="gpu/webgpu.js"></script>
<script src="bridge.js"></script>
<script>
// Host page of the browser port: loads the client jar's resources (packed from the user's own installation),
// initialises the WebAssembly shader toolchain and the WebGPU device, then starts the real
// net.minecraft.client.main.Main compiled by TeaVM (clientmain.js).
'use strict';
const params = new URLSearchParams(location.search);
const embedded = params.get('embedded') === '1';
// All game parts live on the Hugging Face Space. The same files are also
// available next to this page, which is used as an offline fallback.
const HF_BASE = 'https://huggingface.co/spaces/matthewcodergamer/minecraft-browser/resolve/main/';
if (embedded) document.documentElement.classList.add('embedded');
// Direct hits on the canvas host must pass through the ad-supported launcher.
if (!embedded) {
  let passOK = false;
  try {
    const p = Number(sessionStorage.getItem('mw_play_pass'));
    passOK = p > 0 && Date.now() - p < 21600000;
  } catch (e) {}
  if (!passOK) location.replace('/?from=game');
}

// World handshake with the page that owns the menus. Java's ChunkBridge reads
// these globals when the title screen is idle, so the host can apply the name,
// seed, mode, difficulty and toggles from the Create/Select World screens.
window.__mcWorldAuto = !embedded && params.get('world') !== '0';
window.__mcWorldRequested = null;
// Set by the owning page when the player imports a saves folder. The manifest
// lists every file the host stored in IndexedDB (`mc-world-files`); the Java
// side can stream those same entries and run DataFixerUpper on old formats.
window.__mcWorldImport = null;
if (params.has('name') || params.has('seed') || params.has('mode')) {
  window.__mcWorldRequested = {
    name: params.get('name') || 'World',
    seed: params.get('seed') || '',
    mode: params.get('mode') || 'survival',
    difficulty: params.get('difficulty') || 'normal',
    type: params.get('type') || 'normal',
    commands: params.get('commands') === '1',
    structures: params.get('structures') !== '0',
    bonus: params.get('bonus') === '1',
  };
}
function ackWorld(type) {
  // Tell the owning page the brain has the settings and will start generating.
  if (window.parent === window) return;
  try {
    window.parent.postMessage({
      source: 'mc-brain',
      type: 'world-ack',
      request: type,
      world: window.__mcWorldRequested || null,
    }, '*');
  } catch (e) { /* ignore */ }
}
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.source !== 'mc-host') return;
  if (data.type === 'world-play' || data.type === 'world-create' || data.type === 'world-edit') {
    window.__mcWorldRequested = data.world || {};
    window.__mcWorldAuto = true;
    window.__mcWorldImport = null;
    ackWorld(data.type);
  } else if (data.type === 'world-import') {
    // Let the Java layer pick up the world metadata and the stored manifest.
    window.__mcWorldRequested = data.world || {};
    window.__mcWorldImport = {
      world: data.world || {},
      manifest: Array.isArray(data.manifest) ? data.manifest : [],
      store: 'mc-world-files',
      id: (data.world && data.world.id) || null,
    };
    window.__mcWorldAuto = false;
    ackWorld(data.type);
  } else if (data.type === 'world-stop') {
    window.__mcWorldRequested = null;
    window.__mcWorldImport = null;
    window.__mcWorldAuto = false;
  }
});

let progressLabel = 'Building terrain...';
const msg = (t) => {
  progressLabel = t;
  const el = document.getElementById('boot-msg');
  if (el) el.textContent = t;
  if (window.mcBridge) mcBridge.setProgress(window.__mcProgress || 0, t);
};
const bar = (f) => {
  window.__mcProgress = f;
  const el = document.getElementById('boot-bar');
  if (el) el.style.width = Math.round(f * 100) + '%';
  if (window.mcBridge) mcBridge.setProgress(f, progressLabel);
};
const fail = (t) => {
  const el = document.getElementById('boot-err');
  if (el) {
    el.textContent += t + '\n';
    el.classList.add('show');
  }
  const boot = document.getElementById('boot');
  if (boot) boot.style.display = 'flex';
  window.__mc = Object.assign(window.__mc || {}, { stage: 'failed', error: t });
  if (window.mcBridge) mcBridge.javaError(t);
};
Error.stackTraceLimit = 100;
window.__mcLog = (lvl, text) => console.log('[' + lvl + '] ' + text);
window.__mcExit = (status) => {
  msg('Minecraft exited (' + status + ')');
  const boot = document.getElementById('boot');
  if (boot) boot.style.display = 'flex';
  if (window.mcBridge && status) mcBridge.javaError('Minecraft exited (' + status + ')');
};
window.addEventListener('error', (e) => fail('ERROR: ' + e.message));
window.addEventListener('unhandledrejection', (e) => fail('REJECTION: ' + (e.reason && e.reason.stack || e.reason)));

async function fetchWithProgress(url, label, from, to) {
  // Shared with the host page: ./-relative, range-chunked, resumable. iOS
  // Safari cannot survive a single 31 MB arrayBuffer() when backgrounded.
  return mcBridge.fetchAsset('./' + url, {
    retries: 2,
    onProgress: (fraction, got, total) => {
      const mb = (n) => (n / 1048576).toFixed(0);
      msg(label + ' ' + mb(got) + ' / ' + mb(total || got) + ' MiB');
      bar(from + (to - from) * (fraction || 0));
    },
  });
}

function loadClassicScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error('failed to load ' + s.src));
    document.body.appendChild(s);
  });
}

async function timedFetch(url, options, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 45000);
  try {
    return await fetch(url, Object.assign({ cache: 'no-store' }, options || {}, { signal: ctrl.signal }));
  } catch (e) {
    const err = new Error((e.name === 'AbortError'
      ? 'timed out after ' + Math.round((ms || 45000) / 1000) + 's'
      : e.name + ': ' + e.message) + ' — ' + url);
    err.url = url;
    err.kind = 'network';
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// Reads one part straight off the response body so the progress bar follows
// the real bytes received (ReadableStream), not a timer.
async function downloadPart(url, expected, onBytes) {
  const res = await timedFetch(url, {}, 60000);
  if (!res.ok) {
    const err = new Error('HTTP ' + res.status + ' ' + res.statusText + ' — ' + url);
    err.status = res.status;
    err.url = url;
    err.kind = 'http';
    throw err;
  }
  const chunks = [];
  let received = 0;
  if (res.body && res.body.getReader) {
    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      onBytes && onBytes(value.length, received);
    }
  } else {
    const view = new Uint8Array(await res.arrayBuffer());
    chunks.push(view);
    received = view.length;
    onBytes && onBytes(received, received);
  }
  if (expected && received !== expected) {
    console.warn('part size mismatch: expected ' + expected + ', got ' + received + ' — ' + url);
  }
  return chunks;
}

async function loadBrain() {
  const explicit = params.get('js');
  if (explicit) {
    await loadClassicScript(explicit + '.js');
    return;
  }
  // GitHub Pages caps a single file at 100 MB, so the ~266 MiB TeaVM bundle
  // ships as parts and is reassembled here. Falls back to a single script.
  let manifest = null;
  let manifestBase = './';
  for (const base of [HF_BASE, './']) {
    try {
      const r = await timedFetch(base + 'clientmain.parts.json', {}, 15000);
      if (r.ok) { manifest = await r.json(); manifestBase = base; break; }
    } catch (e) { console.warn('manifest ' + base + ' failed', e); }
  }
  if (!manifest || !Array.isArray(manifest.parts) || !manifest.parts.length) {
    await loadClassicScript('clientmain.js');
    return;
  }
  const parts = manifest.parts.map((p) => typeof p === 'string' ? { name: p } : p);
  const downloadTotal = manifest.downloadTotal
    || parts.reduce((n, p) => n + (p.size || 0), 0);
  const rawTotal = manifest.total || downloadTotal;
  const received = new Array(parts.length).fill(0);
  const buffers = new Array(parts.length);
  const mb = (n) => (n / 1048576).toFixed(1);
  const report = () => {
    const sum = received.reduce((a, b) => a + b, 0);
    bar(0.9 + 0.08 * (sum / (downloadTotal || 1)));
    msg('Downloading Java brain ' + mb(sum) + ' / ' + mb(downloadTotal) + ' MiB');
  };
  report();
  // Download the gzip parts in parallel, each with a ReadableStream reader so
  // progress is measured in received bytes. Hugging Face is the primary source;
  // the same-origin copy is a fallback.
  let next = 0;
  const worker = async () => {
    for (;;) {
      const i = next++;
      if (i >= parts.length) return;
      const name = parts[i].name;
      const expected = parts[i].size || 0;
      const sources = manifestBase === './' ? ['./'] : [manifestBase, './'];
      let lastError = null;
      let done = false;
      for (const base of sources) {
        try {
          buffers[i] = await downloadPart(base + name, expected, (n, got) => {
            received[i] = got;
            report();
          });
          done = true;
          break;
        } catch (e) {
          lastError = e;
          received[i] = 0;
          report();
          console.warn('part ' + name + ' from ' + base + ' failed', e);
        }
      }
      if (!done) throw lastError || new Error('failed to download ' + name);
      report();
    }
  };
  await Promise.all(Array.from({ length: Math.min(3, parts.length) }, worker));
  // buffers[i] is an array of stream chunks; flatten them into one Blob.
  const packed = new Blob([].concat.apply([], buffers));
  let scriptData = packed;
  if (manifest.encoding === 'gzip') {
    if (typeof DecompressionStream !== 'function') {
      throw new Error('This browser cannot decompress the client bundle (no DecompressionStream gzip).');
    }
    msg('Extracting Java Brain…');
    bar(0.985);
    const stream = packed.stream().pipeThrough(new DecompressionStream('gzip'));
    const reader = stream.getReader();
    const chunks = [];
    let extracted = 0;
    for (;;) {
      const step = await reader.read();
      if (step.done) break;
      chunks.push(step.value);
      extracted += step.value.length;
      if (rawTotal) {
        bar(Math.min(1, 0.985 + 0.015 * (extracted / rawTotal)));
        msg('Extracting Java Brain… ' + mb(extracted) + ' / ' + mb(rawTotal) + ' MiB');
      }
    }
    scriptData = new Blob(chunks, { type: 'text/javascript' });
  }
  bar(1);
  msg('Starting Java client…');
  await loadClassicScript(URL.createObjectURL(scriptData));
}

async function loadResources() {
  const buf = await fetchWithProgress('client-resources.bin', 'Loading game resources', 0, 0.6);
  const dv = new DataView(buf);
  if (dv.getUint32(0, false) !== 0x4D435253) throw new Error('bad resource archive');
  const len = dv.getUint32(4, true);
  const index = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, len)));
  const base = 8 + len;
  for (const k in index) index[k][0] += base;
  window.__mcResources = { index, data: buf };
}

function showStats() {
  const el = document.getElementById('stats');
  if (params.get('stats') === '0') return;
  window.__mcOnFps = (fps) => {
    const G = window.__mcWebGPU, s = G && G.stats;
    el.textContent = fps.toFixed(0) + ' fps' + (s ? ' | ' + (G.device ? 'WebGPU' : 'WebGL2') + ' draws ' + s.draws : '');
    if (s) s.draws = 0;
  };
}

(async () => {
  try {
    msg('Loading game resources…');
    await loadResources();
    msg('Starting shader compiler…');
    bar(0.7);
    await __mcShaders.init('');
    msg('Starting graphics…');
    bar(0.8);
    const webgpu = await __mcWebGPU.init();
    console.log(webgpu ? 'Graphics: WebGPU (' + __mcWebGPU.adapterName + ')' : 'Graphics: WebGPU unavailable, using WebGL2');
    msg('Loading Minecraft…');
    bar(0.9);
    await loadBrain();
    bar(1);
    showStats();
    // The Minecraft window (the canvas) appears when the client creates it; hide the boot screen then.
    const waitCanvas = setInterval(() => {
      if (window.__mcSDL && __mcSDL.canvas && window.__mcWebGPU && __mcWebGPU.frame > 0) {
        document.getElementById('boot').style.display = 'none';
        clearInterval(waitCanvas);
      }
    }, 100);
    main([]);
  } catch (e) {
    fail(String(e && e.stack || e));
  }
})();
</script>
</body>
</html>
