<!doctype html>
<html>
<head><meta charset="utf-8"><title>MC browser port - M1</title></head>
<body style="font-family:monospace">
<h3>Minecraft 26.3 client bytecode → TeaVM → browser</h3>
<pre id="log"></pre>
<pre id="err" style="color:red"></pre>
<script>
  window.__mcLog = (lvl, text) => { document.getElementById('log').textContent += '[' + lvl + '] ' + text + '\n'; };
  window.addEventListener('error', e => { document.getElementById('err').textContent += 'ERROR: ' + e.message + '\n'; });
</script>
<script src="m1main.js"></script>
<script>
  try { main([]); } catch (e) { document.getElementById('err').textContent += 'EXCEPTION: ' + e + '\n' + (e.stack || ''); }
</script>
</body>
</html>
