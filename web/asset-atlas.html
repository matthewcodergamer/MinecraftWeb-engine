<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft 26.3 Texture Atlas</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#11151b;color:#e8edf2}
body{margin:0}header{position:sticky;top:0;background:#171e27;padding:16px;z-index:2;border-bottom:1px solid #34404d}
h1{font-size:20px;margin:0 0 8px}.tools{display:flex;gap:8px;flex-wrap:wrap}
input,select{background:#0d1218;color:inherit;border:1px solid #465565;border-radius:7px;padding:10px}
#status{color:#aebdca;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:14px}
figure{margin:0;background:#1b242e;border:1px solid #2d3a47;border-radius:8px;padding:8px;min-width:0}
figure img{width:100%;height:100px;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#27313c 0 25%,#202a34 0 50%) 0/16px 16px}
figcaption{font-size:11px;overflow-wrap:anywhere;color:#c8d2dc;margin-top:7px}
</style>
</head>
<body>
<header><h1>Minecraft 26.3 — Complete Vanilla Texture Inventory</h1>
<div class="tools"><input id="search" type="search" placeholder="Search texture paths…"><select id="category"><option value="">All texture folders</option></select></div>
<div id="status">Loading Mojang texture inventory…</div></header>
<main class="grid" id="grid"></main>
<script>
(async()=>{
 const status=document.querySelector('#status'),grid=document.querySelector('#grid');
 const search=document.querySelector('#search'),category=document.querySelector('#category');
 try{
  const response=await fetch('ui/assets/full/texture-index.json');
  if(!response.ok)throw new Error('Texture index not found yet. Run the Extract Minecraft 26.3 textures workflow.');
  const data=await response.json(),items=data.textures||[];
  const categories=[...new Set(items.map(x=>x.category))].sort();
  for(const name of categories){const option=document.createElement('option');option.value=name;option.textContent=name;category.append(option)}
  function render(){
   const q=search.value.trim().toLowerCase(),c=category.value;
   const visible=items.filter(x=>(!c||x.category===c)&&(!q||x.path.toLowerCase().includes(q)));
   status.textContent=visible.length+' / '+items.length+' textures · '+data.version+' · asset index '+data.asset_index;
   grid.replaceChildren();
   const fragment=document.createDocumentFragment();
   for(const item of visible){
    const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');
    img.loading='lazy';img.alt=item.path;img.src='ui/assets/full/'+item.path;
    caption.textContent=item.path;
    figure.append(img,caption);fragment.append(figure);
   }
   grid.append(fragment);
  }
  search.addEventListener('input',render);category.addEventListener('change',render);render();
 }catch(error){status.textContent=error.message}
})();
</script>
</body></html>
