<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ef323d">
<link rel="icon" href="ui/dirt_block.png">
<link rel="stylesheet" href="ui/sprites/sprites.css">
<title>Minecraft</title>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: url('ui/font/minecraft.woff') format('woff');
    font-display: block;
  }
  :root {
    --mc-red: #ef323d;
    --mc-yellow: #ffff00;
    --mc-font: "Minecraft", "MinecraftTen", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --kb: 0px;
  }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--mc-font); touch-action: none;
  }
  button { font-family: inherit; }

  /* ------------------------------------------------------------------ canvas */
  #mc-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    display: block; outline: none; touch-action: none; image-rendering: pixelated;
    z-index: 1; background: #000;
  }
  #stats {
    position: fixed; left: 8px; top: 6px; z-index: 6; color: #fff;
    max-width: 38vw; padding: 3px 6px; background: rgba(0,0,0,.32);
    font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-shadow: 1px 1px 0 #000; pointer-events: none; opacity: .8;
    white-space: normal; display: none;
  }
  body.debug #stats { display: block; }
  body.touch-ui #stats { display: none; }
  #hint {
    position: fixed; left: 50%; top: calc(50px + env(safe-area-inset-top));
    transform: translateX(-50%); z-index: 6; padding: 7px 12px; border-radius: 2px;
    color: #fff; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.25);
    font: 12px/1.4 system-ui, sans-serif; pointer-events: none; text-align: center;
    transition: opacity .8s ease; opacity: 0;
  }
  #hint.show { opacity: 1; }
  body.touch-ui #hint { display: none; }

  /* The client jar's own 15x15 crosshair sprite, difference-blended so it
     stays visible on bright sky and dark caves like the Java overlay. */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; z-index: 4;
    transform: translate(-50%, -50%); pointer-events: none; opacity: .9;
    background: url('ui/gui/crosshair.png') center/100% 100% no-repeat;
    image-rendering: pixelated;
    mix-blend-mode: difference;
  }
  body:not(.playing) #crosshair { display: none; }

  /* ------------------------------------------------------- 1. Mojang splash
     First paint: flat #EF323D, stacked Mojang Studios wordmark, nothing else. */
  #splash {
    position: fixed; inset: 0; z-index: 2147483600; background: var(--mc-red);
    display: grid; place-items: center; transition: opacity .8s ease;
  }
  #splash.done { opacity: 0; pointer-events: none; }
  /* mojangstudios.png is a 512² stack of the two words. The vanilla loading
     screen draws the top half on the left and the bottom half on the right,
     which recomposes the 1024x256 "MOJANG STUDIOS" wordmark undistorted. */
  #splash .wordmark {
    width: min(86vw, 760px); aspect-ratio: 4 / 1; display: flex;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.14));
  }
  #splash .wordmark .half {
    width: 50%; height: 100%;
    background: url('ui/mojangstudios.png') no-repeat;
    background-size: 100% 200%;
    image-rendering: auto;
  }
  #splash .wordmark .half.left  { background-position: 0 0; }
  #splash .wordmark .half.right { background-position: 0 100%; }

  /* ------------------------------------------------------------- main menu */
  #menu {
    position: fixed; inset: 0; z-index: 3000; overflow: hidden;
    background: #7fa8dd; display: none;
  }
  #menu.open { display: block; }

  /* Inside-out cubemap. The perspective distance equals the cube's half-size,
     and the cube is pushed forward so its centre sits exactly on the camera:
     the four side faces then cover 90° each, just like the vanilla panorama. */
  .pano {
    position: absolute; inset: 0; z-index: 1; overflow: hidden;
    background: #7fa8dd; perspective: 50vmax; perspective-origin: 50% 50%;
    contain: strict;
  }
  .pano-cube {
    position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    transform-style: preserve-3d; will-change: transform;
    animation: pano-spin 180s linear infinite;
  }
  @keyframes pano-spin {
    from { transform: translateZ(50vmax) rotateX(-2deg) rotateY(0deg); }
    to   { transform: translateZ(50vmax) rotateX(-2deg) rotateY(360deg); }
  }
  .pano-face {
    /* 0.8vmax of overlap on every edge hides the sub-pixel seam where two
       faces meet, without visibly distorting the 90° cube geometry. */
    position: absolute; width: 100.8vmax; height: 100.8vmax;
    left: -50.4vmax; top: -50.4vmax;
    background-color: #6f9bd4; background-repeat: no-repeat; background-size: 100% 100%;
    /* Dappled Forest fallback, replaced by the real faces once they load. */
    background-image:
      linear-gradient(to bottom, rgba(255,255,255,0) 46%, rgba(24,40,22,.5) 66%),
      repeating-linear-gradient(90deg, rgba(28,52,32,0) 0 40px, rgba(28,52,32,.45) 40px 54px, rgba(28,52,32,0) 54px 96px),
      linear-gradient(#7fb0e6 0%, #bcd8f4 44%, #73925c 62%, #35502f 80%, #2b2418 100%);
  }
  /* panorama_0..3 are the continuous 360° strip (0 -> 1 -> 2 -> 3 -> 0),
     panorama_4 is up, panorama_5 is down. Measured from the 26.3 asset pack. */
  .pano-face.f0 { transform: rotateY(0deg)    translateZ(-50vmax); }
  .pano-face.f1 { transform: rotateY(-90deg)  translateZ(-50vmax); }
  .pano-face.f2 { transform: rotateY(180deg)  translateZ(-50vmax); }
  .pano-face.f3 { transform: rotateY(90deg)   translateZ(-50vmax); }
  .pano-face.top    { transform: rotateX(-90deg) translateZ(-50vmax); }
  .pano-face.bottom { transform: rotateX(90deg)  translateZ(-50vmax); }

  .pano.live .f0 { background-image: url('ui/panorama/panorama_0.png'); }
  .pano.live .f1 { background-image: url('ui/panorama/panorama_1.png'); }
  .pano.live .f2 { background-image: url('ui/panorama/panorama_2.png'); }
  .pano.live .f3 { background-image: url('ui/panorama/panorama_3.png'); }
  .pano.live .top    { background-image: url('ui/panorama/panorama_4.png'); }
  .pano.live .bottom { background-image: url('ui/panorama/panorama_5.png'); }

  /* Portrait phones cannot fill the inside-out cube without showing corners;
     use one real panorama face as a cover image instead. */
  @media (orientation: portrait) {
    .pano-cube { display: none; }
    .pano { background: url('ui/panorama/panorama_0.png') center / cover no-repeat; }
  }

  #menu .scrim {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.08), rgba(0,0,0,.46));
  }

  /* Vanilla draws every title/pause widget in GUI pixels and then multiplies
     the whole screen by Options.guiScale. Reproduce that exactly: children
     below use the literal coordinates from TitleScreen.init()/PauseScreen,
     and this layer is multiplied by --gui. */
  .gui-layer {
    position: absolute; left: 0; top: 0;
    width: calc(100vw / var(--gui, 1));
    height: calc(100vh / var(--gui, 1));
    height: calc(100dvh / var(--gui, 1));
    transform: scale(var(--gui, 1));
    transform-origin: 0 0;
    pointer-events: none;
    /* transform makes this a stacking context, so raise the whole layer above
       the panorama (1) and scrim (2). */
    z-index: 3;
  }

  /* LogoRenderer: logo at (width/2 - 128, 30), 256x44; the edition wordmark
     overlaps it by 7px at (width/2 - 64, 67), 128x14. The source images are
     4x; object-fit crops the transparent bottom of the 256x64 texture. */
  .logo-wrap {
    position: absolute; left: 50%; top: 30px;
    width: min(256px, calc(100% - 8px));
    aspect-ratio: 256 / 44;
    transform: translateX(-50%);
    pointer-events: none; z-index: 3;
  }
  #menu-logo {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    image-rendering: pixelated; -webkit-user-drag: none;
  }
  #menu-edition {
    /* LogoRenderer draws the edition at (0, 37) in the logo's 256x44 space,
       so it scales with the logo on narrow screens. */
    position: absolute; left: 50%; top: 84.09%;
    width: 50%; height: 36.36%; transform: translateX(-50%);
    image-rendering: pixelated; -webkit-user-drag: none;
  }

  /* SplashRenderer: anchor at (width/2 + 123, 69) = logo right - 5, logo top
     + 39. rotate(-20deg); scale = (1.8 - 0.1|sin t|) * 100 / (textWidth + 32). */
  #menu-splash-anchor {
    /* TitleScreen: width/2 + 123, 69 — fixed GUI coordinates, not scaled
       with the logo. */
    position: absolute; left: calc(50% + 123px); top: 69px;
    width: 0; height: 0; transform-origin: 0 0; z-index: 4;
    animation: splash-pulse 1s ease-in-out infinite;
  }
  #menu-splash {
    position: absolute; left: 0; top: -8px; transform: translateX(-50%);
    color: var(--mc-yellow); font: 400 8px/8px var(--mc-font);
    text-shadow: 1px 1px 0 #3f3f00; white-space: nowrap;
    pointer-events: none;
  }
  @keyframes splash-pulse {
    0%, 100% { transform: rotate(-20deg) scale(calc(var(--splash-unit, .01) * 1.8)); }
    50%      { transform: rotate(-20deg) scale(calc(var(--splash-unit, .01) * 1.7)); }
  }

  /* Buttons live in a click-through layer so the #menu-buttons delegation
     keeps working while each button is absolutely positioned. */
  #menu-buttons { position: absolute; inset: 0; pointer-events: none; z-index: 4; }

  /* Generic button base, shared with the unscaled world-create/inventory
     screens (those use --gui directly, not the scaled layer). */
  .mc-button {
    display: grid; place-items: center; width: 100%;
    height: calc(20px * var(--gui, 1)); box-sizing: border-box; padding: 0;
    color: #fff; font: 400 calc(8px * var(--gui, 1))/1 var(--mc-font); letter-spacing: 0;
    text-shadow: 1px 1px 0 #3f3f3f;
    text-align: center; border-radius: 0; box-shadow: none;
    cursor: pointer; image-rendering: pixelated; -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    pointer-events: auto;
  }
  #menu-gui .mc-button, #pause .mc-button { font-size: 8px; line-height: 8px; }
  .mc-button:hover, .mc-button:focus-visible {
    color: #ffffa0; text-shadow: 1px 1px 0 #3f3f00; outline: none;
  }
  .mc-button:active { filter: brightness(.82); }
  .mc-button:disabled, .mc-button.disabled { color: #a0a0a0; cursor: default; }
  /* Nine-slice swap from the real widget/button_highlighted.png .mcmeta. */
  .mc-button.sprite-widget-button:hover,
  .mc-button.sprite-widget-button:focus-visible {
    border-image-source: url('ui/sprites/widget/button_highlighted.png');
  }

  .mc-icon-button {
    display: grid; place-items: center; box-sizing: border-box; padding: 0;
    width: 20px; height: 20px; border-radius: 0;
    cursor: pointer; image-rendering: pixelated; -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    pointer-events: auto;
  }
  .mc-icon-button:hover, .mc-icon-button:focus-visible {
    border-image-source: url('ui/sprites/widget/button_highlighted.png'); outline: none;
  }
  /* Vanilla draws the 15x15 icon centred over the whole 20x20 button, not
     inside the 3px nine-slice border box. */
  .mc-icon-button img, .mc-icon-button > span {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated; pointer-events: none;
  }
  .mc-icon-button img { width: 15px; height: 15px; }
  .mc-icon-button img.profile { width: 16px; height: 16px; }

  /* TitleScreen.init() absolute coordinates, in GUI pixels.
       y0 = height/4 + 48; each row advances 24px; half buttons are 98px. */
  .menu-singleplayer { position: absolute; left: calc(50% - 100px); top: calc(25% + 48px); width: 200px; height: 20px; }
  .menu-multiplayer  { position: absolute; left: calc(50% - 100px); top: calc(25% + 72px); width: 200px; height: 20px; }
  .menu-realms       { position: absolute; left: calc(50% - 100px); top: calc(25% + 96px); width: 200px; height: 20px; }
  .menu-icon-profile       { position: absolute; left: calc(50% - 34px); top: calc(25% + 120px); }
  .menu-icon-language      { position: absolute; left: calc(50% - 10px); top: calc(25% + 120px); }
  .menu-icon-accessibility { position: absolute; left: calc(50% + 14px); top: calc(25% + 120px); }
  .menu-options { position: absolute; left: calc(50% - 100px); top: calc(25% + 144px); width: 98px; height: 20px; }
  .menu-quit    { position: absolute; left: calc(50% + 2px);   top: calc(25% + 144px); width: 98px; height: 20px; }

  /* Version string is drawn at (2, height - 10); copyright is right-aligned
     to width - copyrightWidth - 2. */
  #menu-footer {
    position: absolute; left: 2px; right: 2px; bottom: 2px;
    z-index: 3; display: flex; justify-content: space-between; gap: 8px;
    color: #fff; font: 400 8px/8px var(--mc-font);
    text-shadow: 1px 1px 0 #3f3f3f; pointer-events: none;
  }
  #menu-footer span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu-gui.narrow #menu-footer span:last-child { display: none; }

  /* ---------------------------------------------------------------- pause
     PauseScreen.createPauseMenu(): GridLayout with 2 columns, default cell
     padding (left 4, top 4, right 4, bottom 0), row 0 paddingTop(50), grid
     212x166, then FrameLayout.alignInRectangle(..., 0.5, 0.25). The rules
     below are the resulting absolute positions in GUI pixels. */
  #pause { position: fixed; inset: 0; z-index: 3500; display: none; }
  #pause.open { display: block; }
  .pause-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.251);              /* inworld_menu_background.png: #00000040 */
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #pause .gui-layer { z-index: 1; }
  .pause-title {
    position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
    color: #fff; font: 400 8px/8px var(--mc-font); text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap; pointer-events: none;
  }
  #pause-buttons { position: absolute; inset: 0; pointer-events: none; }
  .pause-btn, .pause-icon { position: absolute; }
  .pause-back         { left: calc(50% - 102px); top: calc(25% + 8.5px);   width: 204px; height: 20px; }
  .pause-advancements { left: calc(50% - 102px); top: calc(25% + 32.5px);  width: 98px;  height: 20px; }
  .pause-stats        { left: calc(50% + 4px);   top: calc(25% + 32.5px);  width: 98px;  height: 20px; }
  .pause-icon-bug     { left: calc(50% - 46px);  top: calc(25% + 56.5px); }
  .pause-icon-social  { left: calc(50% - 22px);  top: calc(25% + 56.5px); }
  .pause-icon-friends { left: calc(50% + 2px);   top: calc(25% + 56.5px); }
  .pause-icon-report  { left: calc(50% + 26px);  top: calc(25% + 56.5px); }
  .pause-options       { left: calc(50% - 102px); top: calc(25% + 80.5px);  width: 98px; height: 20px; }
  .pause-world-options { left: calc(50% + 4px);   top: calc(25% + 80.5px);  width: 98px; height: 20px; }
  .pause-quit          { left: calc(50% - 102px); top: calc(25% + 104.5px); width: 204px; height: 20px; }

  .pause-icon .sprite-pause_menu-bug,
  .pause-icon .sprite-pause_menu-social_interactions,
  .pause-icon .sprite-pause_menu-player_reporting {
    display: block; width: 15px; height: 15px; image-rendering: pixelated;
  }
  .pause-icon img { width: 16px; height: 16px; image-rendering: pixelated; pointer-events: none; }

  body.paused #hotbar, body.paused #mc-status, body.paused #mc-hand,
  body.paused #crosshair, body.paused #mc-touch, body.paused #mc-inv-btn,
  body.paused #mc-chat-btn, body.paused #mc-pause-btn { display: none !important; }

  /* ------------------------------------------------------ world creation
     Java's Create New World screen: tiled dirt, dark title, labelled fields. */
  #world-create {
    position: fixed; inset: 0; z-index: 3900; display: none; overflow: auto;
    background: #000 url('ui/dirt.png') repeat;
    background-size: 64px 64px; image-rendering: pixelated;
    padding: max(18px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
  }
  #world-create.open { display: block; }
  #world-create::before {
    content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.62);
    pointer-events: none;
  }
  .wc-panel {
    position: relative; z-index: 1; width: min(92vw, 440px); margin: 0 auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  .wc-title {
    margin: 4px 0 8px; color: #fff; text-align: center; font: 400 24px/1.2 var(--mc-font);
    text-shadow: 2px 2px 0 #3f3f3f;
  }
  .wc-field { display: flex; flex-direction: column; gap: 4px; color: #a0a0a0;
    font: 400 16px/1.2 var(--mc-font); text-shadow: 2px 2px 0 #1a1a1a; }
  .wc-field input, .wc-field select {
    height: 36px; box-sizing: border-box; padding: 0 8px;
    background: #000; color: #e0e0e0; border: 2px solid #a0a0a0; border-radius: 0;
    font: 400 16px/1 var(--mc-font); outline: none; -webkit-appearance: none;
  }
  .wc-field input:focus, .wc-field select:focus { border-color: #fff; }
  .wc-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .wc-buttons .mc-button { height: 40px; }

  /* --------------------------------------------------------- world loading
     Dirt only ever appears here: one stretched image, never tiled. */
  #loading {
    position: fixed; inset: 0; z-index: 4000; overflow: hidden;
    background-color: #2f2115;
    background-image: url('ui/dirt.png');
    background-size: 64px 64px;
    background-position: top left;
    background-repeat: repeat;
    image-rendering: pixelated;
    transition: opacity 1.1s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading.gone, #loading.hidden { display: none; }
  /* Boot failure is not world generation: no dirt behind a crash report. */
  #loading.error {
    background-image: none; background-color: #171a1d;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px;
  }
  #loading.error #progress-wrap { display: none; }
  #load-title {
    display: none; color: #ffb3b3; text-align: center;
    font: 700 clamp(15px, 3.4vw, 22px)/1.3 var(--mc-font); letter-spacing: .03em;
    text-shadow: 2px 2px 0 #000;
  }
  #loading.error #load-title { display: block; }

  #progress-wrap {
    position: absolute; left: 50%; top: 78%; transform: translate(-50%, -50%);
    width: min(64vw, 420px);
  }
  #progress-text {
    color: var(--mc-yellow); font-size: 16px; line-height: 1.4;
    margin-bottom: 7px; text-shadow: 1px 1px 0 rgba(0,0,0,.8);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  #progress {
    height: 10px; padding: 1px; background: #e8e8e8;
    box-shadow: 0 0 0 1px rgba(0,0,0,.65);
  }
  #progress-fill {
    height: 100%; width: 0%; background: #80ff20; transition: width .18s linear;
  }
  #version {
    position: absolute; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom));
    color: rgba(255,255,255,.72); font: 11px/1.2 ui-monospace, Menlo, monospace;
    text-shadow: 1px 1px 0 rgba(0,0,0,.6);
  }
  #load-error {
    display: none; width: min(88vw, 760px); color: #ffd7d7;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,120,120,.55);
    padding: 10px 12px; font: 12px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; max-height: 40vh; overflow: auto;
    -webkit-user-select: text; user-select: text;
  }
  #loading.error #load-error { display: block; }
  #error-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #error-actions:empty { display: none; }

  /* First-person right arm, the way Java's hand renderer fills the lower
     right corner. Fixed pixel art from the Steve skin. */
  #mc-hand {
    position: fixed; right: -1vw; bottom: -5vh; z-index: 4;
    width: 13vw; height: 40vh; pointer-events: none; opacity: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.32) 0 5%, rgba(0,0,0,0) 5%),
      linear-gradient(to right, rgba(38,22,12,.55) 0 7%, rgba(0,0,0,0) 7% 93%, rgba(0,0,0,.18) 93%),
      url('ui/hand.png') center/100% 100% no-repeat;
    background-size: 100% 100%, 100% 100%, 100% 100%;
    image-rendering: pixelated;
    clip-path: polygon(34% 0, 66% 0, 100% 100%, 0 100%);
    transform: rotate(-16deg); transform-origin: 100% 100%;
    filter: drop-shadow(-2px 3px 4px rgba(0,0,0,.35));
    transition: opacity .2s ease;
  }
  body.playing #mc-hand { opacity: 1; }

  /* ---------------------------------------------------------------- HUD
     Exact Java layout: the jar's 182x22 hotbar sprite at 2x (364x44), 20px
     slots, selection sprite drawn over the selected slot, hearts/food above. */
  #hotbar {
    position: fixed; left: 50%; bottom: calc(1px * var(--gui) + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 5;
    width: calc(182px * var(--gui)); height: calc(22px * var(--gui));
    display: flex; gap: 0; padding: calc(1px * var(--gui));
    box-sizing: border-box; pointer-events: none;
    opacity: 0; transition: opacity .35s ease;
    background: url('ui/gui/hotbar.png') center/100% 100% no-repeat;
    image-rendering: pixelated;
  }
  #hotbar.show { opacity: 1; }
  #hotbar .slot {
    width: calc(20px * var(--gui)); height: calc(20px * var(--gui)); box-sizing: border-box;
    position: relative; pointer-events: auto; cursor: pointer;
    background: transparent;
  }
  #hotbar .slot .item {
    position: absolute; inset: calc(2px * var(--gui)); background-size: 100% 100%;
    background-position: center; background-repeat: no-repeat;
    image-rendering: pixelated; pointer-events: none;
  }
  #hotbar .slot.selected::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: calc(24px * var(--gui)); height: calc(23px * var(--gui)); transform: translate(-50%, -50%);
    background: url('ui/gui/hotbar_selection.png') center/100% 100% no-repeat;
    image-rendering: pixelated; pointer-events: none;
  }
  #hotbar .slot .count {
    position: absolute; right: calc(.5px * var(--gui)); bottom: calc(-.5px * var(--gui));
    z-index: 1; color: #fff;
    font: 700 calc(4px * var(--gui))/1 ui-monospace, Menlo, monospace;
    text-shadow: calc(.5px * var(--gui)) calc(.5px * var(--gui)) 0 #000;
  }
  #mc-status {
    position: fixed; left: 50%; bottom: calc(24px * var(--gui) + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 5;
    width: calc(182px * var(--gui)); height: calc(9px * var(--gui));
    display: flex; justify-content: space-between;
    pointer-events: none; opacity: 0; transition: opacity .35s ease;
    image-rendering: pixelated;
  }
  #mc-status.show { opacity: 1; }
  #mc-status .row { display: flex; }
  #mc-status .icon {
    width: calc(9px * var(--gui)); height: calc(9px * var(--gui)); background-size: 100% 100%;
    background-repeat: no-repeat; image-rendering: pixelated;
  }
  #mc-hearts .icon { background-image: url('ui/gui/heart_full.png'); }
  #mc-food .icon { background-image: url('ui/gui/food_full.png'); }
  #mc-inv-btn {
    position: fixed; right: calc(8px + env(safe-area-inset-right));
    top: calc(48px + env(safe-area-inset-top)); z-index: 6;
    width: 40px; height: 34px; display: none; place-items: center;
    background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.4);
    color: #fff; font: 400 16px/1 var(--mc-font); border-radius: 0;
    -webkit-appearance: none; text-shadow: 2px 2px 0 #000;
  }
  body.playing #mc-inv-btn { display: grid; }
  /* Java has no on-screen HUD buttons; the browser only needs this on touch
     (where there is no E key). Desktop still opens it with E. */
  body.playing:not(.touch-ui) #mc-inv-btn { display: none; }

  /* ------------------------------------------------------------ touch UI */
  /* Bedrock "Joystick & aim crosshair" layout: translucent stick bottom-left,
     jump/crouch/fly as rounded translucent touch buttons bottom-right. */
  #mc-touch {
    position: fixed; inset: 0; z-index: 3; display: none; pointer-events: none;
    touch-action: none;
  }
  #mc-touch.active { display: block; }
  #mc-stick {
    position: absolute; left: calc(18px + env(safe-area-inset-left));
    bottom: calc(74px + env(safe-area-inset-bottom));
    width: 132px; height: 132px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.18), rgba(255,255,255,.06) 64%, rgba(0,0,0,.12));
    border: 2px solid rgba(255,255,255,.55);
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.16), 0 4px 14px rgba(0,0,0,.30);
    pointer-events: auto; touch-action: none;
  }
  #mc-stick .arrow {
    position: absolute; width: 0; height: 0; border: 7px solid transparent;
    opacity: .55; filter: drop-shadow(0 1px 0 rgba(0,0,0,.45));
  }
  #mc-stick .up    { top: 8px; left: 50%; margin-left: -7px; border-bottom-color: #fff; }
  #mc-stick .down  { bottom: 8px; left: 50%; margin-left: -7px; border-top-color: #fff; }
  #mc-stick .left  { left: 8px; top: 50%; margin-top: -7px; border-right-color: #fff; }
  #mc-stick .right { right: 8px; top: 50%; margin-top: -7px; border-left-color: #fff; }
  #mc-stick-knob {
    position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
    margin: -29px 0 0 -29px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, rgba(255,255,255,.78), rgba(205,205,205,.38));
    border: 2px solid rgba(255,255,255,.86);
    box-shadow: 0 2px 8px rgba(0,0,0,.38), inset 0 -2px 0 rgba(0,0,0,.12);
  }
  #mc-actions {
    position: absolute; right: calc(16px + env(safe-area-inset-right));
    bottom: calc(74px + env(safe-area-inset-bottom));
    width: 180px; height: 180px; pointer-events: none;
  }
  .mc-action {
    position: absolute; pointer-events: auto; touch-action: none;
    -webkit-appearance: none; padding: 0; display: grid; place-items: center;
    border-radius: 16px; border: 2px solid rgba(255,255,255,.62);
    color: #fff; background: rgba(255,255,255,.15);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.15), 0 3px 10px rgba(0,0,0,.30);
    backdrop-filter: blur(1.5px);
    transition: background .08s ease, transform .08s ease;
  }
  .mc-action svg { width: 60%; height: 60%; filter: drop-shadow(1px 2px 0 rgba(0,0,0,.55)); }
  .mc-action.on { background: rgba(255,255,255,.46); transform: scale(.94); }
  #mc-jump  { right: 0; bottom: 0; width: 82px; height: 82px; border-radius: 20px; }
  #mc-sneak { right: 90px; bottom: 0; width: 64px; height: 64px; }
  #mc-fly   { right: 0; bottom: 92px; width: 64px; height: 64px; }
  #mc-fly.on { background: rgba(120,200,255,.42); }
  @media (max-width: 420px) {
    #mc-stick { width: 112px; height: 112px; }
    #mc-stick-knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
    #mc-stick .arrow { border-width: 6px; }
    #mc-actions { width: 158px; height: 158px; }
    #mc-jump  { width: 72px; height: 72px; border-radius: 18px; }
    #mc-sneak { right: 78px; width: 58px; height: 58px; }
    #mc-fly   { right: 0; bottom: 80px; width: 58px; height: 58px; }
  }
  body.touch-ui #mc-touch.active { display: block; }
  /* Must beat the rule above, hence the .active in the selector. */
  body.text-open #mc-touch.active,
  body.text-open #hotbar,
  body.text-open #mc-status,
  body.text-open #crosshair { display: none; }

  #mc-chat-btn {
    position: fixed; right: calc(8px + env(safe-area-inset-right));
    top: calc(8px + env(safe-area-inset-top)); z-index: 6;
    width: 40px; height: 34px; display: none; place-items: center;
    background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.4);
    color: #fff; font: 700 14px/1 var(--mc-font); border-radius: 3px;
    -webkit-appearance: none;
  }
  body.touch-ui.playing #mc-chat-btn { display: grid; }

  /* Desktop has Esc; touch needs a visible pause control. */
  #mc-pause-btn {
    position: fixed; right: calc(8px + env(safe-area-inset-right));
    top: calc(8px + env(safe-area-inset-top)); z-index: 6;
    width: 40px; height: 34px; display: none; place-items: center;
    background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.4);
    color: #fff; font: 700 14px/1 var(--mc-font); border-radius: 3px;
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body.playing #mc-pause-btn { display: grid; }
  /* On touch the chat and inventory buttons already occupy the top-right. */
  body.touch-ui.playing #mc-pause-btn { top: calc(88px + env(safe-area-inset-top)); }

  /* --------------------------------------------------------------- inventory */
  #inventory {
    position: fixed; inset: 0; z-index: 2100; display: none;
    place-items: center; background: rgba(0,0,0,.55);
  }
  #inventory.open { display: grid; }
  .inv-panel {
    width: min(92vw, 460px); padding: 10px;
    background: #c6c6c6; border: 2px solid #000;
    box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #555;
  }
  .inv-title { font: 700 14px/1 var(--mc-font); color: #3f3f3f; margin: 4px 4px 10px; }
  .inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; }
  .inv-grid .cell {
    aspect-ratio: 1; background: #8b8b8b;
    box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #fff;
  }
  .inv-close { margin-top: 10px; }

  /* ------------------------------------------------------- text / chat bar
     Kept outside the canvas and pinned with visualViewport, so iOS can slide
     the keyboard up without resizing or scrolling the WebGPU surface. */
  #mc-chat {
    position: fixed; left: 0; right: 0; z-index: 2200; display: none;
    padding: 8px calc(8px + env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-right));
    background: rgba(0,0,0,.72);
    bottom: var(--kb); transition: bottom .12s ease-out;
  }
  #mc-chat.open { display: block; }
  #mc-chat .row { display: flex; gap: 8px; width: min(100%, 720px); margin: 0 auto; }
  #mc-chat-input {
    flex: 1 1 auto; min-width: 0; height: 40px; box-sizing: border-box;
    padding: 0 10px; border: 2px solid #000; background: #000; color: #fff;
    font: 16px/1 var(--mc-font); outline: none; border-radius: 0;
    -webkit-user-select: text; user-select: text;
  }
  #mc-chat-input::placeholder { color: #777; }
  #mc-chat-send {
    flex: 0 0 auto; height: 40px; padding: 0 14px; border: 2px solid #000;
    background: #6c6c6c; color: #fff; font: 700 13px/1 var(--mc-font);
    box-shadow: inset 2px 2px 0 #a8a8a8, inset -2px -2px 0 #4a4a4a;
  }

  /* --------------------------------------------------------------- toast */
  #mc-toast {
    position: fixed; left: 50%; z-index: 5000; max-width: 84vw;
    bottom: calc(64px + env(safe-area-inset-bottom));
    transform: translateX(-50%); padding: 8px 14px;
    background: rgba(0,0,0,.78); border: 2px solid #555; color: #fff;
    font: 13px/1.3 var(--mc-font); text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .25s ease;
  }
  #mc-toast.show { opacity: 1; }
:root{--gui:3}</style>
</head>
<body>
  <!-- 1. The very first screen: solid Mojang red, stacked wordmark. -->
  

  <!-- 2. Main menu: rotating 26.3 panorama, logo, splash, five buttons. -->
  <div id="menu">
    <div class="pano" id="pano" aria-hidden="true">
      <div class="pano-cube">
        <div class="pano-face f0"></div>
        <div class="pano-face f1"></div>
        <div class="pano-face f2"></div>
        <div class="pano-face f3"></div>
        <div class="pano-face top"></div>
        <div class="pano-face bottom"></div>
      </div>
    </div>
    <div class="scrim"></div>
    <div id="menu-gui" class="gui-layer">
      <div class="logo-wrap">
        <img id="menu-logo" src="ui/minecraft.png" alt="Minecraft">
        <img id="menu-edition" src="ui/edition.png" alt="Java Edition">
      </div>
      <div id="menu-splash-anchor"><span id="menu-splash" aria-hidden="true">Now with WebGPU!</span></div>
      <div id="menu-buttons">
        <button class="mc-button sprite-widget-button menu-singleplayer" type="button" data-action="singleplayer">Singleplayer</button>
        <button class="mc-button sprite-widget-button menu-multiplayer" type="button" data-action="multiplayer">Multiplayer</button>
        <button class="mc-button sprite-widget-button menu-realms" type="button" data-action="realms">Minecraft Realms</button>
        <button class="mc-icon-button sprite-widget-button menu-icon-profile" type="button" data-action="profile" title="Minecraft profile"><img class="profile" src="ui/gui/profile.png" alt=""></button>
        <button class="mc-icon-button sprite-widget-button menu-icon-language" type="button" data-action="language" title="Language"><img src="ui/gui/language.png" alt=""></button>
        <button class="mc-icon-button sprite-widget-button menu-icon-accessibility" type="button" data-action="accessibility" title="Accessibility"><img src="ui/gui/accessibility.png" alt=""></button>
        <button class="mc-button sprite-widget-button menu-options" type="button" data-action="options">Options...</button>
        <button class="mc-button sprite-widget-button menu-quit" type="button" data-action="quit">Quit Game</button>
      </div>
      <div id="menu-footer">
        <span>Minecraft 26.3 (Modded)</span>
        <span>Copyright Mojang AB. Do not distribute!</span>
      </div>
    </div>
  </div>

  <!-- Pause menu: real PauseScreen GridLayout (2 columns, 4px cell padding,
       row 0 paddingTop 50, 212x166 grid aligned at 50% / 25%). -->
  <div id="pause" class="open" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="pause-backdrop"></div>
    <div class="gui-layer">
      <div id="pause-title" class="pause-title">Game</div>
      <div id="pause-buttons">
        <button class="mc-button sprite-widget-button pause-btn pause-back" type="button" data-pause="back">Back to Game</button>
        <button class="mc-button sprite-widget-button pause-btn pause-advancements" type="button" data-pause="advancements">Advancements</button>
        <button class="mc-button sprite-widget-button pause-btn pause-stats" type="button" data-pause="stats">Statistics</button>
        <button class="mc-icon-button sprite-widget-button pause-icon pause-icon-bug" type="button" data-pause="bug" title="Report Bugs"><span class="sprite-pause_menu-bug"></span></button>
        <button class="mc-icon-button sprite-widget-button pause-icon pause-icon-social" type="button" data-pause="social" title="Social Interactions"><span class="sprite-pause_menu-social_interactions"></span></button>
        <button class="mc-icon-button sprite-widget-button pause-icon pause-icon-friends" type="button" data-pause="friends" title="Friends"><img src="ui/gui/profile.png" alt=""></button>
        <button class="mc-icon-button sprite-widget-button pause-icon pause-icon-report" type="button" data-pause="report" title="Player Reporting"><span class="sprite-pause_menu-player_reporting"></span></button>
        <button class="mc-button sprite-widget-button pause-btn pause-options" type="button" data-pause="options">Options...</button>
        <button class="mc-button sprite-widget-button pause-btn pause-world-options" type="button" data-pause="world-options">World Options...</button>
        <button class="mc-button sprite-widget-button pause-btn pause-quit" type="button" data-pause="quit">Save &amp; Quit</button>
      </div>
    </div>
  </div>

  <!-- 3. Create New World (Java layout/colours, dirt background). -->
  <div id="world-create" role="dialog" aria-modal="true" aria-labelledby="wc-title">
    <div class="wc-panel">
      <div class="wc-title" id="wc-title">Create New World</div>
      <label class="wc-field">World Name
        <input id="wc-name" type="text" value="New World" maxlength="32" autocomplete="off">
      </label>
      <label class="wc-field">Seed for the World Generator (leave blank for random)
        <input id="wc-seed" type="text" inputmode="numeric" placeholder="" autocomplete="off">
      </label>
      <label class="wc-field">Game Mode
        <select id="wc-mode">
          <option value="survival">Survival Mode</option>
          <option value="creative">Creative Mode</option>
          <option value="hardcore">Hardcore Mode</option>
        </select>
      </label>
      <div class="wc-buttons">
        <button id="wc-create" class="mc-button sprite-widget-button" type="button">Create New World</button>
        <button id="wc-cancel" class="mc-button sprite-widget-button" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- 3. Game surface + HUD. -->
  <canvas id="mc-canvas" tabindex="0"></canvas>
  <div id="crosshair"></div>
  <div id="mc-hand" aria-hidden="true"></div>
  <div id="hotbar" aria-hidden="true"></div>
  <div id="mc-status" aria-hidden="true">
    <div id="mc-hearts" class="row"></div>
    <div id="mc-food" class="row"></div>
  </div>
  <button id="mc-inv-btn" type="button" aria-label="Inventory">...</button>
  <div id="stats"></div>
  <div id="hint">WASD move · mouse look · Space jump · Shift sneak</div>
  <button id="mc-chat-btn" type="button" aria-label="Chat">💬</button>
  <button id="mc-pause-btn" type="button" aria-label="Pause">II</button>

  <!-- Inventory -->
  <div id="inventory">
    <div class="inv-panel">
      <div class="inv-title">Inventory</div>
      <div class="inv-grid" id="inv-grid"></div>
      <button class="mc-button sprite-widget-button inv-close" type="button">Done</button>
    </div>
  </div>

  <!-- Chat / sign text. Opens the real iOS keyboard. -->
  <div id="mc-chat">
    <div class="row">
      <input id="mc-chat-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="Say something...">
      <button id="mc-chat-send" type="button">Send</button>
    </div>
  </div>

  <!-- The Java client runs here, off-screen. It owns world state and physics.
       Absent from this deploy, so the page runs renderer-only. -->
  

  <!-- 4. World-generation loading: dirt, stretched, progress bar. -->
  
    </div>
    <div id="load-error"></div>
    <div id="error-actions"></div>
    <div id="version">Minecraft 26.3 · browser port</div>
  </div>

  <div id="mc-toast"></div>

  
  
  
<script>addEventListener("load",()=>{document.fonts.ready.then(()=>{const s=document.getElementById("menu-splash"),a=document.getElementById("menu-splash-anchor");a.style.setProperty("--splash-unit",String(100/(s.offsetWidth+32)));});});</script></body>
</html>
