[package]
name = "mc-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native Vulkan/wgpu Minecraft 26.3 client for Android (no WebView)"

[lib]
name = "mc_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mc-native"
path = "src/main.rs"

[dependencies]
# wgpu 30.0.2 is the API the renderer is written against: CurrentSurfaceTexture,
# Queue::present, immediate_size, multiview_mask and depth_slice.
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", features = ["android-native-activity"] }
pollster = "1.0.3"
png = "0.18.1"
log = "0.4.35"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
