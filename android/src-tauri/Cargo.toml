[package]
name = "minecraft-browser-android"
version = "26.3.0"
description = "Android Tauri shell for the Minecraft Java 26.3 browser client"
authors = ["Matthew Coder Gamer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "minecraft_browser_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
