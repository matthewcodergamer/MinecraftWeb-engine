[package]
name = "mc-body"
version = "0.1.0"
edition = "2021"
publish = false
description = "Zombie Hybrid Body: Rust/wgpu WebGPU renderer for the Minecraft browser port (iPhone 11 first)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 30.x needs `CurrentSurfaceTexture`, `immediate_size`, `multiview_mask`,
# `depth_slice` and `Queue::present`; this scaffold matches 30.0.1 exactly.
wgpu = { version = "30.0", features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# Vanilla block textures are decoded from the client jar's own PNGs; keeping the
# decoder in Rust means the page stays free of asset/rendering logic.
png = "0.17"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "Window",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
