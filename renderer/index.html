<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Minecraft — browser body</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; overscroll-behavior: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #status {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
      color: #cfd6e4; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center; white-space: pre-wrap; pointer-events: none;
    }
    #stats {
      position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      padding: 8px 10px; max-width: calc(100vw - 24px); box-sizing: border-box;
      color: #d7e0ee; background: rgba(8, 12, 20, 0.55);
      border: 1px solid rgba(120, 150, 190, 0.25); border-radius: 6px;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; pointer-events: none;
    }
    #hint {
      position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top));
      transform: translateX(-50%); max-width: calc(100vw - 24px); box-sizing: border-box;
      padding: 7px 12px; border-radius: 8px; color: #fff;
      background: rgba(8, 12, 20, 0.55); border: 1px solid rgba(120, 150, 190, 0.25);
      font: 12px/1.5 system-ui, sans-serif; pointer-events: none;
      transition: opacity .6s; text-align: center;
    }
    @media (max-width: 520px) {
      #stats { left: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); font-size: 10px; }
      #hint { font-size: 11px; }
    }
    #crosshair {
      position: fixed; left: 50%; top: 50%; width: 18px; height: 18px;
      transform: translate(-50%, -50%); pointer-events: none; opacity: .8;
      background:
        linear-gradient(#fff, #fff) center/2px 18px no-repeat,
        linear-gradient(#fff, #fff) center/18px 2px no-repeat;
      mix-blend-mode: difference;
    }
    @media (pointer: coarse) { #crosshair { opacity: .55; } }
    #shader-menu-button {
      position: fixed; top: 12px; right: 12px; z-index: 20; padding: 9px 13px;
      color: #fff; background: #343434; border: 2px solid #111; border-radius: 3px;
      box-shadow: inset 0 0 0 1px #777, 0 2px 5px #0008;
      font: 13px system-ui, sans-serif; cursor: pointer;
    }
    #shader-menu {
      position: fixed; z-index: 21; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(390px, calc(100vw - 32px)); padding: 18px; box-sizing: border-box;
      color: #eee; background: #292929; border: 2px solid #111;
      box-shadow: inset 0 0 0 1px #777, 0 12px 40px #000b;
      font: 14px/1.45 system-ui, sans-serif;
    }
    #shader-menu[hidden] { display: none; }
    #shader-menu h2 { margin: 0 0 5px; font-size: 18px; font-weight: 600; }
    #shader-menu p { margin: 0 0 15px; color: #bbb; font-size: 12px; }
    #shader-menu label { display: flex; align-items: center; gap: 10px; padding: 12px;
      background: #1c1c1c; border: 1px solid #555; cursor: pointer; }
    #shader-menu input { width: 18px; height: 18px; accent-color: #79b7ff; }
    #shader-menu .menu-actions { display: flex; justify-content: flex-end; margin-top: 15px; }
    #shader-menu button { padding: 7px 18px; color: white; background: #505050;
      border: 1px solid #888; border-radius: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="mc-canvas"></canvas>
  <div id="crosshair"></div>
  <div id="status">starting mc-body…</div>
  <div id="stats"></div>
  <div id="hint">WASD move · mouse look · Space jump · Ctrl sprint · F fly — tap to capture mouse</div>
  <button id="shader-menu-button" type="button" aria-haspopup="dialog" aria-controls="shader-menu">Video Settings</button>
  <section id="shader-menu" role="dialog" aria-modal="true" aria-labelledby="shader-menu-title" hidden>
    <h2 id="shader-menu-title">Shaders</h2>
    <p>Choose the active lighting renderer. Vanilla is enabled by default.</p>
    <label for="complementary-toggle">
      <input id="complementary-toggle" type="checkbox">
      <span>Complementary Shaders</span>
    </label>
    <div class="menu-actions"><button id="shader-menu-done" type="button">Done</button></div>
  </section>

  <!-- Harness only: loads the wasm module, hands the client jar's own block PNGs
       to Rust, then hands control to Rust. There is no rendering logic here. -->
  <script type="module">
    import init, { run, texture_count, texture_name, upload_texture, set_complementary_enabled, complementary_enabled } from "./pkg/mc_body.js";

    const status = document.getElementById('status');
    const hint = document.getElementById('hint');
    const shaderMenu = document.getElementById('shader-menu');
    const shaderMenuButton = document.getElementById('shader-menu-button');
    const shaderMenuDone = document.getElementById('shader-menu-done');
    const complementaryToggle = document.getElementById('complementary-toggle');

    function closeShaderMenu() {
      shaderMenu.hidden = true;
      shaderMenuButton.focus();
    }
    shaderMenuButton.addEventListener('click', () => {
      shaderMenu.hidden = !shaderMenu.hidden;
      if (!shaderMenu.hidden) complementaryToggle.focus();
    });
    shaderMenuDone.addEventListener('click', closeShaderMenu);
    complementaryToggle.addEventListener('change', () => {
      set_complementary_enabled(complementaryToggle.checked);
    });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !shaderMenu.hidden) {
        event.preventDefault();
        closeShaderMenu();
      }
    });
    const fail = (error) => {
      status.textContent = String(error && error.stack || error);
      status.style.color = '#f88';
      console.error(error);
    };

    const ARCHIVE_CANDIDATES = ['client-textures.bin', 'client-resources.bin', '../build/web/client-textures.bin', '../build/web/client-resources.bin'];

    async function loadArchive() {
      for (const url of ARCHIVE_CANDIDATES) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;
          const buffer = await response.arrayBuffer();
          const view = new DataView(buffer);
          if (view.getUint32(0, false) !== 0x4D435253) continue;
          const length = view.getUint32(4, true);
          const index = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, 8, length)));
          const base = 8 + length;
          for (const key in index) index[key][0] += base;
          return { buffer, index };
        } catch (error) {
          console.warn('resource archive ' + url + ':', error);
        }
      }
      throw new Error('client-resources.bin not found (run scripts/serve.sh)');
    }

    (async () => {
      try {
        await init();
        complementaryToggle.checked = complementary_enabled();
        status.textContent = 'loading block textures…';
        const archive = await loadArchive();
        let uploaded = 0;
        for (let layer = 0; layer < texture_count(); layer++) {
          const entry = archive.index[texture_name(layer)];
          if (!entry) continue;
          upload_texture(layer, new Uint8Array(archive.buffer, entry[0], entry[1]));
          uploaded++;
        }
        console.log('block textures: ' + uploaded + '/' + texture_count() + ' from the client jar');
        status.textContent = '';
        if (matchMedia('(pointer: coarse)').matches) {
          hint.textContent = 'left stick = move · right drag = look · JUMP/SHIFT buttons'+
            ' · F toggles fly';
        }
        setTimeout(() => { hint.style.opacity = '0'; }, 7000);
        run();
      } catch (error) {
        fail(error);
      }
    })();
  </script>
</body>
</html>
