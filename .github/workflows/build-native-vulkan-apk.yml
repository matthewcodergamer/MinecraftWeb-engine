name: Build native Vulkan APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "native/**"
      - ".github/workflows/build-native-vulkan-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-native-vulkan-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, and NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the arm64 native Vulkan library
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          mkdir -p android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs \
            build --manifest-path native/Cargo.toml --release --lib
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          readelf -d android/app/src/main/jniLibs/arm64-v8a/libmc_native.so \
            | grep -E 'libvulkan|libandroid|liblog'

      - name: Generate a release keystore
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mcnative-release.jks"
          STORE_PASS="$(openssl rand -hex 16)"
          KEY_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias mcnative \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Minecraft Native Vulkan, OU=Release, O=matthewcodergamer, C=US"
          {
            echo "MC_ANDROID_KEYSTORE=$KEYSTORE"
            echo "MC_ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "MC_ANDROID_KEY_ALIAS=mcnative"
            echo "MC_ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build the signed release APK
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease --no-daemon --stacktrace
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/minecraft-native-vulkan-0.1.0-arm64.apk
          cp "$APK" dist/minecraft-native-vulkan-latest.apk
          ls -lh dist

      - name: Verify the APK is native Vulkan and not a WebView
        run: |
          set -euo pipefail
          APK=dist/minecraft-native-vulkan-latest.apk
          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmc_native.so'
          if unzip -l "$APK" | grep -Eiq 'webview|chromium|src-tauri'; then
            echo "WebView/Tauri content found in the APK" >&2
            exit 1
          fi

          "$BT/aapt2" dump badging "$APK" \
            | grep -q "package: name='com.matthewcodergamer.mcnative'"
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml \
            | grep -q 'android.app.NativeActivity'

          unzip -p "$APK" lib/arm64-v8a/libmc_native.so > /tmp/libmc_native.so
          readelf -d /tmp/libmc_native.so | grep -q 'libvulkan.so'
          if readelf -d /tmp/libmc_native.so | grep -Eiq 'webview|chromium'; then
            echo "WebView dependency found in libmc_native.so" >&2
            exit 1
          fi
          readelf -l /tmp/libmc_native.so | grep -q '0x4000'

          "$BT/apksigner" verify --print-certs "$APK"

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-native-vulkan-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish the APK to the latest native release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-vulkan-latest
          name: Minecraft Native Vulkan (latest)
          body: |
            Native arm64 Android APK built from `${{ github.sha }}`.

            - Vulkan/wgpu renderer, `android.app.NativeActivity`, no WebView or Tauri.
            - Vanilla block textures, generated overworld, touch look/move, double-tap jump.
            - This is the separate native client, not the browser Java Edition play page.
            - Install with `adb install -r minecraft-native-vulkan-latest.apk` or tap the APK on the phone.
          files: dist/*.apk
          prerelease: true
          make_latest: false
