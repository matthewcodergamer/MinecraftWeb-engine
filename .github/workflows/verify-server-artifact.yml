name: Verify dedicated server artifact

on:
  push:
    paths:
      - "scripts/fetch_server.py"
      - "scripts/build.sh"
      - "scripts/build_server_probe.sh"
      - "scripts/test_fetch_server.py"
      - ".github/workflows/verify-server-artifact.yml"
  pull_request:
    paths:
      - "scripts/fetch_server.py"
      - "scripts/build.sh"
      - "scripts/build_server_probe.sh"
      - "scripts/test_fetch_server.py"
      - ".github/workflows/verify-server-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-server-artifact-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check script syntax
        run: |
          python3 -m py_compile scripts/fetch_server.py scripts/test_fetch_server.py
          bash -n scripts/build.sh scripts/build_server_probe.sh

      - name: Test bundle extraction offline
        run: python3 -m unittest discover -s scripts -p 'test_fetch_server.py' -v

      - name: Fetch and verify official Minecraft 26.3 server
        run: python3 scripts/fetch_server.py --version 26.3 --dest "$RUNNER_TEMP/minecraft"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Fetch client jar and declared libraries
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --dest "$MC_DIR"

      - name: Fetch TeaVM toolchain
        run: |
          python3 scripts/fetch_deps.py \
            org.teavm:teavm-tooling:0.16.0 \
            org.teavm:teavm-classlib:0.16.0 \
            org.teavm:teavm-jso-apis:0.16.0 \
            org.teavm:teavm-jso-impl:0.16.0 \
            org.teavm:teavm-platform:0.16.0

      - name: Compile built-in bootstrap with server-first TeaVM classpath
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
          MC_SERVER_JAR: ${{ runner.temp }}/minecraft/versions/26.3/server.jar
          MC_SERVER_LIB_LIST: ${{ runner.temp }}/minecraft/versions/26.3/server-libraries.list
          JDK: ${{ env.JAVA_HOME }}
          PORT_HEAP: 6g
          PORT_OPT: SIMPLE
          PORT_LENIENT: "true"
        run: bash scripts/build_server_probe.sh

      - name: Prepare browser resources for bootstrap smoke test
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: |
          mkdir -p build/web
          cp -R web/. build/web/
          python3 scripts/pack_resources.py --mc-dir "$MC_DIR" --version "$MC_VERSION" --jar-only --out build/web/client-resources.bin

      - name: Run server-first bootstrap in headless Chrome
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          command -v "$CHROME"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web > /tmp/mc-http.log 2>&1 &
          python3 scripts/cdp.py "http://127.0.0.1:8765/run.html?js=m2main" \
            --until-js "window.__mc && window.__mc.stage === 'm2-complete'" \
            --timeout 180 --eval "JSON.stringify(window.__mc)"

      - name: Diagnose TeaVM build of the real dedicated server entry point
        continue-on-error: true
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
          MC_SERVER_JAR: ${{ runner.temp }}/minecraft/versions/26.3/server.jar
          MC_SERVER_LIB_LIST: ${{ runner.temp }}/minecraft/versions/26.3/server-libraries.list
          JDK: ${{ env.JAVA_HOME }}
          PORT_HEAP: 6g
          PORT_OPT: SIMPLE
          PORT_LENIENT: "true"
          PORT_LOG_LINES: "200"
        run: bash scripts/build.sh net.minecraft.server.Main js

      - name: Upload dedicated server entry-point diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-26-3-server-main-teavm-diagnostics
          path: build/net.minecraft.server.Main.js.log
          if-no-files-found: warn
          retention-days: 7

      - name: Confirm extracted server artifact
        env:
          SERVER_JAR: ${{ runner.temp }}/minecraft/versions/26.3/server.jar
        run: |
          test -s "$SERVER_JAR"
          python3 - <<'PY'
          import os
          import zipfile
          path = os.environ["SERVER_JAR"]
          with zipfile.ZipFile(path) as jar:
              names = set(jar.namelist())
          assert "net/minecraft/server/Main.class" in names
          assert "net/minecraft/server/level/ServerLevel.class" in names
          assert "net/minecraft/client/Minecraft.class" not in names
          print("Dedicated server classes present; client entry point absent.")
          PY
