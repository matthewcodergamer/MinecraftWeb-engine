name: Fetch Complementary shader sources

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Complementary Reimagined version to fetch"
        required: true
        default: "r5.9.3"
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-headless-webgpu-boot

      - name: Query Modrinth by project ID and download requested ZIP
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/complementary renderer/src/shaders/complementary/glsl_source
          curl -fsSL --retry 3 -H "User-Agent: MinecraftWeb-engine shader research" \
            "https://api.modrinth.com/v2/project/HVnmMxH1/version" \
            -o /tmp/complementary/versions.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          versions=json.loads(Path("/tmp/complementary/versions.json").read_text())
          requested=os.environ["REQUESTED_VERSION"].strip()
          version=next((v for v in versions if v.get("version_number")==requested),None)
          if version is None:
              available=", ".join(v.get("version_number","?") for v in versions[:12])
              raise SystemExit(f"Requested version {requested!r} not found. Recent versions: {available}")
          files=version.get("files") or []
          selected=next((f for f in files if f.get("primary")), files[0] if files else None)
          if not selected or not selected.get("filename","").lower().endswith(".zip"):
              raise SystemExit("Latest version has no primary ZIP")
          Path("/tmp/complementary/selected.json").write_text(json.dumps({
              "version":version.get("version_number"), "filename":selected["filename"],
              "url":selected["url"], "sha512":(selected.get("hashes") or {}).get("sha512")
          }))
          if requested.lower()=="r5.9.3" and "r5.9.3" not in selected["filename"].lower():
              raise SystemExit(f"Expected r5.9.3 archive, got {selected['filename']}")
          print("Selected version:",version.get("version_number"),selected["filename"])
          PY
          URL="$(python3 -c 'import json;print(json.load(open("/tmp/complementary/selected.json"))["url"])')"
          curl -fsSL --retry 3 -H "User-Agent: MinecraftWeb-engine shader research" \
            "$URL" -o /tmp/complementary/pack.zip
          HASH="$(python3 -c 'import json;print(json.load(open("/tmp/complementary/selected.json")).get("sha512") or "")')"
          if [ -n "$HASH" ]; then echo "$HASH  /tmp/complementary/pack.zip" | sha512sum --check -; fi

      - name: Safely extract GLSL into ephemeral runner workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path,PurePosixPath
          dst=Path("renderer/src/shaders/complementary/glsl_source")
          dst.mkdir(parents=True,exist_ok=True)
          found=[]
          with zipfile.ZipFile("/tmp/complementary/pack.zip") as z:
              for item in z.infolist():
                  p=PurePosixPath(item.filename)
                  if item.is_dir() or p.is_absolute() or ".." in p.parts: continue
                  if not any(x.lower()=="shaders" for x in p.parts): continue
                  if p.suffix.lower() not in {".vsh",".fsh",".glsl"}: continue
                  i=next(i for i,x in enumerate(p.parts) if x.lower()=="shaders")
                  rel=Path(*p.parts[i+1:])
                  if not rel.parts: continue
                  target=dst/rel
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
                  found.append(str(target))
          if not found: raise SystemExit("No GLSL shader files found below shaders/")
          Path("/tmp/complementary/inventory.json").write_text(json.dumps(found,indent=2))
          print(f"Extracted {len(found)} GLSL files for this run only.")
          print("Upstream shader files are not committed or uploaded; review the release license before redistribution.")
          PY
          {
            echo "## Complementary source fetch"
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/complementary/selected.json").read_text())
          f=json.loads(Path("/tmp/complementary/inventory.json").read_text())
          print(f"- Version: {d['version']} ({d['filename']})")
          print(f"- GLSL files extracted in ephemeral workspace: {len(f)}")
          print("- Source is not committed or published as an artifact.")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
