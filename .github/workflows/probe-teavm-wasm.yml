name: Probe TeaVM WebAssembly GC client build

on:
  push:
    branches:
      - feat/client-headless-webgpu-boot
    paths:
      - ".github/workflows/probe-teavm-wasm.yml"
      - "scripts/build.sh"
      - "tools/src/PortBuilder.java"
      - "tools/src/PortTransformer.java"
      - "tools/src/org/teavm/backend/wasm/vtable/WasmGCVirtualTableBuilder.java"
      - "src/compat/java/**"
      - "src/compat/java-base-overlay/**"
      - "src/compat/jdk-jfr-overlay/**"
      - "patches/rules.txt"
      - "web/**"
      - "scripts/cdp.py"
      - "scripts/pack_resources.py"
      - "scripts/build_body.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-gc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Fetch official Minecraft 26.3 client
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --dest "$MC_DIR"

      - name: Fetch TeaVM toolchain
        run: |
          python3 scripts/fetch_deps.py \
            org.teavm:teavm-tooling:0.16.0 \
            org.teavm:teavm-classlib:0.16.0 \
            org.teavm:teavm-jso-apis:0.16.0 \
            org.teavm:teavm-jso-impl:0.16.0 \
            org.teavm:teavm-platform:0.16.0

      - name: Compile actual Minecraft client to WebAssembly GC
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
          JDK: ${{ env.JAVA_HOME }}
          PORT_HEAP: 12g
          PORT_STACK: 256m
          PORT_JAVA_OPTS: "-Dport.fast=true -Dport.why=io.netty.util.internal.PlatformDependent0,io.netty.buffer.VarHandleByteBufferAccess,io.netty.channel.nio.NioIoHandler,com.mojang.realmsclient.client.FileDownload,com.mojang.realmsclient.client.FileUpload,net.minecraft.network.CompressionDecoder,net.minecraft.util.Crypt,net.minecraft.server.network.ServerLoginPacketListenerImpl,java.nio.channels,java.util.concurrent.Semaphore,java.lang.invoke.VarHandle,java.net.http.HttpClient,javax.crypto.Cipher,java.security.Signature,net.minecraft.util.ThreadingDetector,net.minecraft.client.color.block.BlockTintCache -XX:+UseSerialGC"
          PORT_OPT: FULL
          PORT_LENIENT: "true"
        run: bash scripts/build.sh mcport.ClientMain wasm

      - name: Install Binaryen WebAssembly optimizer
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Optimize and measure WebAssembly function sizes
        run: |
          set -euo pipefail
          wasm-opt build/web/clientmain.wasm -Oz --converge --outlining --code-folding --directize --one-caller-inline-max-function-size=100 -o build/web/clientmain_opt.wasm
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build/web/clientmain_opt.wasm")
          data = path.read_bytes()

          def uleb(buf, pos):
              value = shift = 0
              while True:
                  byte = buf[pos]
                  pos += 1
                  value |= (byte & 0x7f) << shift
                  if not byte & 0x80:
                      return value, pos
                  shift += 7

          pos = 8
          largest = (0, -1)
          while pos < len(data):
              section_id = data[pos]
              pos += 1
              section_size, pos = uleb(data, pos)
              section_end = pos + section_size
              if section_id == 10:
                  count, cursor = uleb(data, pos)
                  for index in range(count):
                      body_size, cursor = uleb(data, cursor)
                      if body_size > largest[0]:
                          largest = (body_size, index)
                      cursor += body_size
                  if cursor != section_end:
                      raise SystemExit(f"Malformed code section: parsed to {cursor}, expected {section_end}")
              pos = section_end

          original = Path("build/web/clientmain.wasm")
          print(f"Binaryen input: {original.stat().st_size:,} bytes")
          print(f"Binaryen output: {path.stat().st_size:,} bytes")
          print(f"Largest function body: {largest[0]:,} bytes (defined function index {largest[1]})")
          limit = 7_654_321
          if largest[0] >= limit:
              raise SystemExit(f"Largest function remains at/above Chrome's observed limit ({limit:,} bytes)")
          path.replace(original)
          print("Optimized module replaced original; largest function is below observed Chrome limit.")
          PY

      - name: Report Binaryen function metrics
        if: always()
        run: |
          if [ -s build/web/clientmain.wasm ]; then
            wasm-opt build/web/clientmain.wasm --metrics --func-metrics -o /dev/null || true
          fi

      - name: Stage TeaVM 0.16.0 Wasm GC browser runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jars = sorted(Path("tools/lib").glob("*.jar"))
          resources = (
              "org/teavm/backend/wasm/wasm-gc-runtime.min.js",
              "org/teavm/backend/wasm/wasm-gc-runtime.js",
          )
          for resource in resources:
              for jar in jars:
                  try:
                      with ZipFile(jar) as archive:
                          data = archive.read(resource)
                  except (KeyError, OSError):
                      continue
                  target = Path("build/web/clientmain.wasm-runtime.js")
                  target.write_bytes(data)
                  print(f"Copied {resource} from {jar}: {len(data):,} bytes -> {target}")
                  raise SystemExit(0)
          raise SystemExit("TeaVM 0.16.0 Wasm GC runtime resource was not found in tools/lib/*.jar")
          PY

      - name: Stage browser page and vanilla resources
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: |
          cp -R web/. build/web/
          python3 scripts/pack_resources.py --mc-dir "$MC_DIR" --version "$MC_VERSION" --jar-only --out build/web/client-resources.bin
          test -s build/web/client-resources.bin
          test -s build/web/client-textures.bin

      - name: Build Rust WebGPU Body
        run: bash scripts/build_body.sh

      - name: Upload TeaVM compiler diagnostics (including failed builds)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teavm-wasm-build-log
          path: build/mcport.ClientMain.wasm.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify TeaVM WebAssembly outputs
        run: |
          test -s build/web/clientmain.wasm
          test -s build/web/clientmain.wasm-runtime.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ("clientmain.wasm", "clientmain.wasm-runtime.js"):
              p = Path("build/web") / name
              print(f"{name}: {p.stat().st_size:,} bytes")
          PY

      - name: Run real Minecraft WASM singleplayer-to-Rust smoke test
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          google-chrome --version
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web > /tmp/minecraft-http.log 2>&1 &
          python3 scripts/cdp.py "http://127.0.0.1:8765/game.html?smoke-world=1&wasm=1" \
            --preload-js "try{sessionStorage.setItem('mw_play_pass',String(Date.now()))}catch(e){}" \
            --until-js "(() => { const f=document.getElementById('mc-brain'); const m=f&&f.contentWindow&&f.contentWindow.__mc; const rust=window.mcBridge&&window.mcBridge.state.module; return window.__mcBodyError || (window.mcBridge && window.mcBridge.state.error) || (rust && rust.java_connected && rust.java_connected()) || (m && m.error); })()" \
            --assert-js "window.__mcBodyReady && window.mcBridge && window.mcBridge.state.module && window.mcBridge.state.module.java_connected() && window.mcBridge.state.module.java_section_count() > 0" \
            --timeout 600 \
            --eval "JSON.stringify({bodyReady:window.__mcBodyReady,javaReady:window.__mcJavaReady,sections:window.mcBridge&&window.mcBridge.state.sections,rustConnected:window.mcBridge&&window.mcBridge.state.module&&window.mcBridge.state.module.java_connected(),rustSections:window.mcBridge&&window.mcBridge.state.module&&window.mcBridge.state.module.java_section_count(),javaError:window.mcBridge&&window.mcBridge.state.error,brainError:(document.getElementById('mc-brain').contentWindow.__mc||{}).error,brainStage:(document.getElementById('mc-brain').contentWindow.__mc||{}).stage,stage:window.__mc&&window.__mc.stage})"

      - name: Upload experimental WebAssembly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teavm-wasm-gc-clientmain
          path: |
            build/web/clientmain.wasm
            build/web/clientmain.wasm-runtime.js
          if-no-files-found: error
          retention-days: 7
