name: Extract Minecraft 26.3 textures

on:
  workflow_dispatch:
    inputs:
      version:
        description: Minecraft version to extract
        required: true
        default: "26.3"

permissions:
  contents: write

concurrency:
  group: extract-minecraft-textures
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify all vanilla textures
        env:
          MC_VERSION: ${{ inputs.version }}
        run: python scripts/extract_all_textures.py

      - name: Build texture inventory atlas
        run: test -s ui/assets/full/texture-index.json

      - name: Commit extracted textures and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/assets/full
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Extract all Minecraft ${{ inputs.version }} vanilla textures"
            git push origin HEAD:main
          fi
