name: Verify real Minecraft client in browser

on:
  push:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  pull_request:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Fetch official Minecraft 26.3 client and asset index
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --dest "$MC_DIR"

      - name: Dump exact Netty NetUtil bytecode for WASM GC failure
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          python3 - <<'PY'
          import glob, json, os, subprocess
          root = os.environ["MC_DIR"]
          meta = json.load(open(os.path.join(root, "versions", os.environ["MC_VERSION"], os.environ["MC_VERSION"] + ".json")))
          jars = []
          for lib in meta.get("libraries", []):
              artifact = lib.get("downloads", {}).get("artifact")
              if artifact and artifact["path"].endswith("netty-common-" + lib["name"].split(":")[-1] + ".jar"):
                  path = os.path.join(root, "libraries", artifact["path"])
                  if os.path.isfile(path):
                      jars.append(path)
          if not jars:
              jars = glob.glob(os.path.join(root, "libraries", "**", "netty-common-*.jar"), recursive=True)
          if not jars:
              raise SystemExit("Could not locate official netty-common jar")
          jar = jars[0]
          print("Netty jar:", jar)
          with open("build/diagnostics/NetUtil.txt", "w") as out:
              out.write("===== io.netty.util.NetUtil from " + jar + " =====\\n")
              subprocess.run(["javap", "-classpath", jar, "-p", "-s", "-c", "io.netty.util.NetUtil"], stdout=out, stderr=subprocess.STDOUT, check=True)
          print("Wrote build/diagnostics/NetUtil.txt")
          PY

      - name: Dump exact Minecraft APIs and bytecode for WASM failures
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: |
          set -euo pipefail
          jar="$MC_DIR/versions/$MC_VERSION/$MC_VERSION.jar"
          mkdir -p build/diagnostics
          for class in \
            net.minecraft.util.filefix.FileFixerUpper \
            net.minecraft.client.renderer.item.CuboidItemModel \
            net.minecraft.client.renderer.item.CuboidItemModelWrapper; do
            name="${class##*.}"
            echo "===== $class =====" | tee "build/diagnostics/$name.txt"
            if jar tf "$jar" | grep -Fx "${class//.//}.class" >/dev/null; then
              javap -classpath "$jar" -p -s -c "$class" >> "build/diagnostics/$name.txt"
              echo "FOUND: $class"
            else
              echo "NOT PRESENT IN OFFICIAL CLIENT JAR: $class" | tee -a "build/diagnostics/$name.txt"
            fi
          done
          cat build/diagnostics/FileFixerUpper.txt
          cat build/diagnostics/CuboidItemModel.txt
          cat build/diagnostics/CuboidItemModelWrapper.txt

      - name: Preserve Minecraft bytecode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-26.3-class-javap
          path: build/diagnostics/
          if-no-files-found: warn

      - name: Fetch TeaVM toolchain
        run: |
          python3 scripts/fetch_deps.py \
            org.teavm:teavm-tooling:0.16.0 \
            org.teavm:teavm-classlib:0.16.0 \
            org.teavm:teavm-jso-apis:0.16.0 \
            org.teavm:teavm-jso-impl:0.16.0 \
            org.teavm:teavm-platform:0.16.0

      - name: Build the actual Minecraft client entry point
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
          JDK: ${{ env.JAVA_HOME }}
          PORT_HEAP: 12g
          PORT_STACK: 256m
          PORT_JAVA_OPTS: "-XX:+UseSerialGC"
          PORT_OPT: ADVANCED
          PORT_LENIENT: "true"
        run: bash scripts/build.sh mcport.ClientMain wasm

      - name: Install Binaryen 133 and try Wasm GC optimization
        run: |
          set -euo pipefail
          archive=binaryen-version_133-x86_64-linux.tar.gz
          base=https://github.com/WebAssembly/binaryen/releases/download/version_133
          curl --fail --location --retry 5 "$base/$archive" -o "/tmp/$archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  /tmp/$archive" | sha256sum --check
          tar -xzf "/tmp/$archive" -C /tmp
          BINARYEN_BIN="/tmp/binaryen-version_133/bin/wasm-opt"
          test -x "$BINARYEN_BIN"
          "$BINARYEN_BIN" --version
          if "${BINARYEN_BIN}" --enable-gc build/web/clientmain.wasm -Oz --converge --outlining --code-folding --directize --one-caller-inline-max-function-size=100 -o build/web/clientmain.optimized.wasm; then
            python3 - <<'PY'
          from pathlib import Path

          def largest_function(path):
              data = path.read_bytes()
              def uleb(buf, pos):
                  value = shift = 0
                  while True:
                      byte = buf[pos]
                      pos += 1
                      value |= (byte & 0x7f) << shift
                      if not byte & 0x80:
                          return value, pos
                      shift += 7
              pos = 8
              largest = (0, -1)
              while pos < len(data):
                  section_id = data[pos]
                  pos += 1
                  section_size, pos = uleb(data, pos)
                  section_end = pos + section_size
                  if section_id == 10:
                      count, cursor = uleb(data, pos)
                      for index in range(count):
                          body_size, cursor = uleb(data, cursor)
                          if body_size > largest[0]:
                              largest = (body_size, index)
                          cursor += body_size
                      if cursor != section_end:
                          raise SystemExit(f"Malformed code section in {path}")
                  pos = section_end
              return len(data), largest

          original = Path("build/web/clientmain.wasm")
          candidate = Path("build/web/clientmain.optimized.wasm")
          try:
              size, (largest, index) = largest_function(candidate)
              print(f"Binaryen 133 output: {size:,} bytes; largest function: {largest:,} bytes (index {index})")
              if largest < 7_654_321:
                  candidate.replace(original)
                  print("ACCEPTED: optimized module is below Chrome's observed function limit.")
              else:
                  print("REJECTED: optimized module still exceeds Chrome's observed function limit; original preserved.")
          except Exception as error:
              print(f"REJECTED: could not validate optimized module: {error}; original preserved.")
          PY
          else
            echo "Binaryen 133 could not optimize this TeaVM module; original WASM preserved."
          fi

      - name: Measure WebAssembly function sizes after TeaVM ADVANCED optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build/web/clientmain.wasm")
          data = path.read_bytes()

          def uleb(buf, pos):
              value = shift = 0
              while True:
                  byte = buf[pos]
                  pos += 1
                  value |= (byte & 0x7f) << shift
                  if not byte & 0x80:
                      return value, pos
                  shift += 7

          pos = 8
          largest = (0, -1)
          while pos < len(data):
              section_id = data[pos]
              pos += 1
              section_size, pos = uleb(data, pos)
              section_end = pos + section_size
              if section_id == 10:
                  count, cursor = uleb(data, pos)
                  for index in range(count):
                      body_size, cursor = uleb(data, cursor)
                      if body_size > largest[0]:
                          largest = (body_size, index)
                      cursor += body_size
                  if cursor != section_end:
                      raise SystemExit(f"Malformed code section: parsed to {cursor}, expected {section_end}")
              pos = section_end

          print(f"TeaVM ADVANCED WASM size: {len(data):,} bytes")
          print(f"Largest function body: {largest[0]:,} bytes (defined function index {largest[1]})")
          limit = 7_654_321
          if largest[0] >= limit:
              print(f"STILL ABOVE observed Chrome function limit ({limit:,} bytes); retain artifact for next strategy.")
          else:
              print("Largest function is below the observed Chrome function limit.")
          PY

      - name: Stage TeaVM 0.16.0 Wasm GC browser runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jars = sorted(Path("tools/lib").glob("*.jar"))
          resources = (
              "org/teavm/backend/wasm/wasm-gc-runtime.min.js",
              "org/teavm/backend/wasm/wasm-gc-runtime.js",
          )
          for resource in resources:
              for jar in jars:
                  try:
                      with ZipFile(jar) as archive:
                          data = archive.read(resource)
                  except (KeyError, OSError):
                      continue
                  target = Path("build/web/clientmain.wasm-runtime.js")
                  target.write_bytes(data)
                  print(f"Copied {resource} from {jar}: {len(data):,} bytes -> {target}")
                  raise SystemExit(0)
          raise SystemExit("TeaVM 0.16.0 Wasm GC runtime resource was not found in tools/lib/*.jar")
          PY

      - name: Stage client page and vanilla resources
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: |
          mkdir -p build/web
          cp -R web/. build/web/
          python3 scripts/pack_resources.py --mc-dir "$MC_DIR" --version "$MC_VERSION" --jar-only --out build/web/client-resources.bin
          test -s build/web/client-resources.bin
          test -s build/web/client-textures.bin
          python3 - <<'PY'
          import json, os, struct
          path = "build/web/client-resources.bin"
          with open(path, "rb") as f:
              assert f.read(4) == b"MCRS"
              length = struct.unpack("<I", f.read(4))[0]
              index = json.loads(f.read(length))
          meta = json.load(open(os.path.join(os.environ["MC_DIR"], "versions/26.3/26.3.json")))
          asset_id = meta["assetIndex"]["id"]
          assert f"assets/indexes/{asset_id}.json" in index
          assert "assets/indexes/26.3.json" in index
          print(f"Packed vanilla jar resources and asset index {asset_id}.")
          PY

      - name: Build Rust WebGPU Body
        run: bash scripts/build_body.sh

      - name: Check browser and JavaScript syntax
        run: |
          google-chrome --version
          python3 -m py_compile scripts/fetch_minecraft.py scripts/cdp.py
          bash -n scripts/build_client_probe.sh scripts/build_body.sh

      - name: Run real client singleplayer-to-Rust smoke test
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web > /tmp/minecraft-http.log 2>&1 &
          python3 scripts/cdp.py "http://127.0.0.1:8765/game.html?smoke-world=1&wasm=1" \
            --preload-js "try{sessionStorage.setItem('mw_play_pass',String(Date.now()))}catch(e){}" \
            --until-js "(() => { const f=document.getElementById('mc-brain'); const m=f&&f.contentWindow&&f.contentWindow.__mc; const rust=window.mcBridge&&window.mcBridge.state.module; return window.__mcBodyError || (window.mcBridge && window.mcBridge.state.error) || (rust && rust.java_connected && rust.java_connected()) || (m && m.error); })()" \
            --assert-js "window.__mcBodyReady && window.mcBridge && window.mcBridge.state.module && window.mcBridge.state.module.java_connected() && window.mcBridge.state.module.java_section_count() > 0" \
            --timeout 600 \
            --eval "JSON.stringify({bodyReady:window.__mcBodyReady,javaReady:window.__mcJavaReady,sections:window.mcBridge&&window.mcBridge.state.sections,rustConnected:window.mcBridge&&window.mcBridge.state.module&&window.mcBridge.state.module.java_connected(),rustSections:window.mcBridge&&window.mcBridge.state.module&&window.mcBridge.state.module.java_section_count(),javaError:window.mcBridge&&window.mcBridge.state.error,brainError:(document.getElementById('mc-brain').contentWindow.__mc||{}).error,brainStage:(document.getElementById('mc-brain').contentWindow.__mc||{}).stage,stage:window.__mc&&window.__mc.stage})"
