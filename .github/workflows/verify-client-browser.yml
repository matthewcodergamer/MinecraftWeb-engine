name: Verify real Minecraft client in browser

on:
  push:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  pull_request:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Fetch official Minecraft 26.3 client and asset index
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --dest "$MC_DIR"

      - name: Fetch TeaVM toolchain
        run: |
          python3 scripts/fetch_deps.py \
            org.teavm:teavm-tooling:0.16.0 \
            org.teavm:teavm-classlib:0.16.0 \
            org.teavm:teavm-jso-apis:0.16.0 \
            org.teavm:teavm-jso-impl:0.16.0 \
            org.teavm:teavm-platform:0.16.0

      - name: Build the actual Minecraft client entry point
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
          JDK: ${{ env.JAVA_HOME }}
          PORT_HEAP: 12g
          PORT_STACK: 256m
          PORT_JAVA_OPTS: "-XX:+UseSerialGC"
          PORT_OPT: ADVANCED
          PORT_LENIENT: "true"
        run: bash scripts/build.sh mcport.ClientMain wasm

      - name: Patch and verify TeaVM Wasm GC runtime
        run: |
          set -euo pipefail
          test -s build/web/clientmain.wasm
          test -s build/web/clientmain.wasm-runtime.js
          python3 scripts/patch_teavm_wasm_runtime.py build/web/clientmain.wasm-runtime.js
          grep -q "createWeakRef" build/web/clientmain.wasm-runtime.js
          echo "Verified clientmain.wasm and patched TeaVM Wasm GC browser runtime"

      - name: Preserve original TeaVM Wasm GC module for Chrome
        run: |
          set -euo pipefail
          # Binaryen 133 can rewrite TeaVM's GC reference casts into br_on_cast
          # sequences rejected by Chrome's WebAssembly validator. Keep the
          # original TeaVM module until an optimized candidate passes Chrome.
          test -s build/web/clientmain.wasm
          rm -f build/web/clientmain.optimized.wasm
          echo "Keeping original TeaVM output; no unverified Binaryen rewrite applied."

      - name: Stage client page and vanilla resources
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: |
          set -euo pipefail
          mkdir -p build/web
          cp -r web/* build/web/
          # Regenerate the Java classpath archive from this exact client and its
          # declared ICU4J libraries. The checked-in web archive can predate ICU
          # timezone bundles, causing UResourceBundle to null-deref at startup.
          python3 scripts/pack_resources.py --mc-dir "$MC_DIR" --version "$MC_VERSION" --jar-only --out build/web/client-resources.bin
          test -s build/web/client-resources.bin

      - name: Build Rust WebGPU Body
        run: bash scripts/build_body.sh

      - name: Check browser and JavaScript syntax
        run: python3 scripts/check_js.py

      - name: Run real client singleplayer-to-Rust smoke test
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory build/web &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          python3 scripts/cdp.py "http://127.0.0.1:8765/game.html?smoke-world=1&wasm=1" \
            --timeout 180 \
            --preload-js "try { sessionStorage.setItem('mw_play_pass', String(Date.now())); } catch (e) {}" \
            --screenshot build/browser_title_or_world.png \
            --until-js "window.__mc && window.__mc.stage === 'complete'" \
            --assert-js "window.__mc && window.__mc.stage === 'complete'" \
            --assert-js "(() => { const c = document.querySelector('canvas'); return !!c && c.width > 0 && c.height > 0; })()"

      - name: Assert browser boot completed and a real screenshot was captured
        run: |
          set -euo pipefail
          test -s build/browser_title_or_world.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path("build/browser_title_or_world.png")
          data = p.read_bytes()
          if data[:8] != b"\\x89PNG\\r\\n\\x1a\\n" or len(data) < 24:
              raise SystemExit("Screenshot is not a valid PNG")
          width, height = struct.unpack(">II", data[16:24])
          if width < 640 or height < 360:
              raise SystemExit(f"Screenshot dimensions too small: {width}x{height}")
          print(f"Verified rendered browser screenshot: {width}x{height} ({len(data)} bytes)")
          PY

      - name: Preserve full Chrome browser console and error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-console-diagnostics
          path: |
            build/browser_console.log
            build/browser_error.txt
            build/browser_title_or_world.png
          if-no-files-found: warn
          retention-days: 14
