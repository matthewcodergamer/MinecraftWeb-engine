name: Verify real Minecraft client in browser

on:
  push:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "tools/src/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  pull_request:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "tools/src/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-browser:
    runs-on: ubuntu-latest
    # The Java->Wasm build is ~35 minutes; leave enough room for the
    # software-WebGPU singleplayer smoke test instead of cancelling it at 60.
    timeout-minutes: 110
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Fetch official Minecraft 26.3 client and asset index
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --dest "$MC_DIR"

      - name: Fetch TeaVM toolchain
        run: |
          python3 scripts/fetch_deps.py \
            org.teavm:teavm-tooling:0.16.0 \
            org.teavm:teavm-classlib:0.16.0 \
            org.teavm:teavm-jso-apis:0.16.0 \
            org.teavm:teavm-jso-impl:0.16.0 \
            org.teavm:teavm-platform:0.16.0

      - name: Build the actual Minecraft client entry point
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
          JDK: ${{ env.JAVA_HOME }}
          PORT_HEAP: 12g
          PORT_STACK: 256m
          PORT_JAVA_OPTS: "-XX:+UseSerialGC"
          PORT_OPT: ADVANCED
          PORT_LENIENT: "true"
        run: bash scripts/build.sh mcport.ClientMain wasm

      - name: Patch and verify TeaVM Wasm GC runtime
        run: |
          set -euo pipefail
          test -s build/web/minecraft-java-edition-v26.3.wasm
          test -s build/web/minecraft-java-edition-v26.3.wasm-runtime.js
          python3 scripts/patch_teavm_wasm_runtime.py build/web/minecraft-java-edition-v26.3.wasm-runtime.js
          grep -q "createWeakRef" build/web/minecraft-java-edition-v26.3.wasm-runtime.js
          echo "Verified minecraft-java-edition-v26.3.wasm and patched TeaVM Wasm GC browser runtime"

      - name: Preserve original TeaVM Wasm GC module for Chrome
        run: |
          set -euo pipefail
          # Binaryen 133 can rewrite TeaVM's GC reference casts into br_on_cast
          # sequences rejected by Chrome's WebAssembly validator. Keep the
          # original TeaVM module until an optimized candidate passes Chrome.
          test -s build/web/minecraft-java-edition-v26.3.wasm
          rm -f build/web/clientmain.optimized.wasm
          echo "Keeping original TeaVM output; no unverified Binaryen rewrite applied."

      - name: Stage client page and vanilla resources
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: |
          set -euo pipefail
          mkdir -p build/web
          cp -r web/* build/web/
          # Regenerate the Java classpath archive from this exact client and its
          # declared ICU4J libraries. The checked-in web archive can predate ICU
          # timezone bundles, causing UResourceBundle to null-deref at startup.
          python3 scripts/pack_resources.py --mc-dir "$MC_DIR" --version "$MC_VERSION" --jar-only --out build/web/minecraft-java-edition-v26.3-assets.bin
          test -s build/web/minecraft-java-edition-v26.3-assets.bin

      - name: Build Rust WebGPU Body
        run: bash scripts/build_body.sh

      - name: Upload built Java client and resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-web-client
          path: |
            build/web/minecraft-java-edition-v26.3.wasm
            build/web/minecraft-java-edition-v26.3.wasm-runtime.js
            build/web/minecraft-java-edition-v26.3-assets.bin
          if-no-files-found: warn
          retention-days: 14

      - name: Check browser and JavaScript syntax
        run: |
          set -euo pipefail
          for file in build/web/*.js; do
            echo "node --check $file"
            node --check "$file"
          done
          # The undefined-supertype scan only applies to the JavaScript backend.
          # This workflow builds WebAssembly, so it has no clientmain.js.
          if [ -f build/web/clientmain.js ]; then
            python3 scripts/check_js.py build/web/clientmain.js
          fi

      - name: Run real client singleplayer-to-Rust smoke test
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory build/web &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          python3 - <<'PY'
          import urllib.request
          url = "http://127.0.0.1:8765/minecraft-java-edition-v26.3.wasm"
          request = urllib.request.Request(url, method="HEAD")
          with urllib.request.urlopen(request, timeout=30) as response:
              ctype = response.headers.get_content_type()
              size = int(response.headers.get("Content-Length") or 0)
          if ctype != "application/wasm":
              raise SystemExit(f"{url} is served as {ctype}, expected application/wasm")
          if size <= 0:
              raise SystemExit(f"{url} has no Content-Length")
          print(f"Verified production WebAssembly MIME: {ctype}, {size:,} bytes")
          PY
          python3 scripts/cdp.py "http://127.0.0.1:8765/game.html?smoke-world=1&wasm=1&diag=1&rd=6&adaptive=0" \
            --timeout 1200 \
            --soak-seconds 60 \
            --soak-screenshot build/smoke_soak.png \
            --preload-js "try { sessionStorage.setItem('mw_play_pass', String(Date.now())); } catch (e) {}" \
            --screenshot build/browser_title_or_world.png \
            --until-js "window.__mc && (window.__mc.stage === 'failed' || window.__mc.javaStage === 'first-java-section-emitted')" \
            --assert-js "window.__mc && window.__mc.javaStage === 'first-java-section-emitted'" \
            --assert-js "window.__mc && window.__mc.stage !== 'failed'" \
            --assert-js "window.__mc && window.__mc.javaStage !== 'failed'" \
            --assert-js "(() => { const f = document.getElementById('mc-brain'); const m = f && f.contentWindow && f.contentWindow.__mc; return !!m && m.stage !== 'failed'; })()" \
            --assert-js "(() => { const f = document.getElementById('mc-brain'); const u = f && f.contentWindow ? String(f.contentWindow.__mcWasmUrl || '') : ''; return u.indexOf('127.0.0.1') >= 0 && u.indexOf('minecraft-java-edition-v26.3.wasm') >= 0; })()" \
            --assert-js "(() => { const c = document.querySelector('canvas'); return !!c && c.width > 0 && c.height > 0; })()"
          cp build/browser_console.log build/smoke_console.log
          cp build/browser_error.txt build/smoke_error.txt

      - name: Run real Java title-screen singleplayer test
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --directory build/web &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          # No smoke-world here: this drives the actual Java TitleScreen and
          # CreateWorldScreen widgets with real CDP mouse events, selects
          # Superflat through the World tab, and creates the world through
          # Java's own UI. On a fresh profile the save list is empty, and
          # WorldSelectionList.handleNewLevels opens CreateWorldScreen directly
          # instead of stopping at SelectWorldScreen, so do not wait for a
          # SelectWorldScreen button that 26.3 never shows in this case.
          python3 scripts/cdp.py "http://127.0.0.1:8766/game.html?wasm=1&diag=1&rd=6&adaptive=0&mobs=0" \
            --timeout 1800 \
            --soak-seconds 120 \
            --soak-screenshot build/title_soak.png \
            --preload-js "try { sessionStorage.setItem('mw_play_pass', String(Date.now())); } catch (e) {}" \
            --actions "wait=window.__mc && document.body.classList.contains('java-ui');shot=build/title_screen.png;click=Singleplayer@TitleScreen;shot=build/create_world.png;click=World@CreateWorldScreen;cycle=World Type|Superflat;shot=build/world_tab_superflat.png;click=Create New World@CreateWorldScreen" \
            --actions-timeout 900 \
            --screenshot build/browser_title_world.png \
            --until-js "window.__mc && (window.__mc.stage === 'failed' || window.__mc.javaStage === 'world-level-and-player-ready')" \
            --assert-js "window.__mc && window.__mc.javaStage === 'world-level-and-player-ready'" \
            --assert-js "window.__mc && window.__mc.stage !== 'failed'" \
            --assert-js "window.__mc && window.__mc.javaStage !== 'failed'" \
            --assert-js "(() => { const f = document.getElementById('mc-brain'); const m = f && f.contentWindow && f.contentWindow.__mc; return !!m && m.stage !== 'failed'; })()" \
            --assert-js "(() => { const f = document.getElementById('mc-brain'); const m = f && f.contentWindow && f.contentWindow.__mc; const b = String(m && m['boot-state'] || ''); return b.indexOf('level=true') >= 0 && b.indexOf('player=true') >= 0; })()" \
            --assert-js "(() => { const f = document.getElementById('mc-brain'); const u = f && f.contentWindow ? String(f.contentWindow.__mcWasmUrl || '') : ''; return u.indexOf('127.0.0.1') >= 0 && u.indexOf('minecraft-java-edition-v26.3.wasm') >= 0; })()" \
            --assert-js "(() => { const f = document.getElementById('mc-brain'); const m = f && f.contentWindow && f.contentWindow.__mc; return !!m && String(m['world-preset'] || '').indexOf('flat') >= 0; })()"
          cp build/browser_console.log build/title_console.log
          cp build/browser_error.txt build/title_error.txt

      - name: Assert browser boot completed and a real screenshot was captured
        run: |
          set -euo pipefail
          test -s build/browser_title_or_world.png
          test -s build/browser_title_world.png
          test -s build/title_screen.png
          test -s build/smoke_soak.png
          test -s build/title_soak.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for name in ("browser_title_or_world.png", "browser_title_world.png", "title_screen.png",
                       "smoke_soak.png", "title_soak.png"):
              p = Path("build") / name
              data = p.read_bytes()
              if data[:8] != bytes([0x89]) + b"PNG\r\n\x1a\n" or len(data) < 24:
                  raise SystemExit(f"{name}: not a valid PNG")
              width, height = struct.unpack(">II", data[16:24])
              if width < 640 or height < 360:
                  raise SystemExit(f"{name}: dimensions too small: {width}x{height}")
              print(f"Verified rendered browser screenshot: {name} {width}x{height} ({len(data)} bytes)")
          PY

      - name: Preserve full Chrome browser console and error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-console-diagnostics
          path: |
            build/browser_console.log
            build/browser_error.txt
            build/browser_title_or_world.png
            build/browser_title_world.png
            build/title_screen.png
            build/select_world.png
            build/create_world.png
            build/world_tab_superflat.png
            build/smoke_soak.png
            build/title_soak.png
            build/smoke_console.log
            build/smoke_error.txt
            build/title_console.log
            build/title_error.txt
          if-no-files-found: warn
          retention-days: 14
