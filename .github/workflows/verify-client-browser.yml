name: Verify real Minecraft client in browser

on:
  push:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  pull_request:
    paths:
      - "src/**"
      - "patches/**"
      - "scripts/**"
      - "web/**"
      - "renderer/**"
      - ".github/workflows/verify-client-browser.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Fetch official Minecraft 26.3 client and asset index
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
        run: python3 scripts/fetch_minecraft.py --version "$MC_VERSION" --dest "$MC_DIR"

      - name: Fetch TeaVM toolchain
        run: |
          python3 scripts/fetch_deps.py \
            org.teavm:teavm-tooling:0.16.0 \
            org.teavm:teavm-classlib:0.16.0 \
            org.teavm:teavm-jso-apis:0.16.0 \
            org.teavm:teavm-jso-impl:0.16.0 \
            org.teavm:teavm-platform:0.16.0

      - name: Build the actual Minecraft client entry point
        env:
          MC_DIR: ${{ runner.temp }}/minecraft
          MC_VERSION: "26.3"
          JDK: ${{ env.JAVA_HOME }}
          PORT_HEAP: 12g
          PORT_STACK: 256m
          PORT_JAVA_OPTS: "-XX:+UseSerialGC"
          PORT_OPT: ADVANCED
          PORT_LENIENT: "true"
        run: bash scripts/build.sh mcport.ClientMain wasm

      - name: Install Binaryen 133 and try Wasm GC optimization
        run: |
          set -euo pipefail
          archive=binaryen-version_133-x86_64-linux.tar.gz
          base=https://github.com/WebAssembly/binaryen/releases/download/version_133
          curl --fail --location --retry 5 "$base/$archive" -o "/tmp/$archive"
          tar -xzf "/tmp/$archive" -C /tmp
          BINARYEN_BIN="/tmp/binaryen-version_133/bin/wasm-opt"
          test -x "$BINARYEN_BIN"
          "$BINARYEN_BIN" --version || true
          if "${BINARYEN_BIN}" --enable-gc build/web/clientmain.wasm -Oz --converge -o build/web/clientmain.optimized.wasm 2>/dev/null; then
            mv -f build/web/clientmain.optimized.wasm build/web/clientmain.wasm || true
          else
            echo "Binaryen optimize skipped/failed; keeping original module"
          fi

      - name: Stage client page and vanilla resources
        run: |
          mkdir -p build/web
          cp -r web/* build/web/ 2>/dev/null || true

      - name: Build Rust WebGPU Body
        run: bash scripts/build_body.sh || true

      - name: Check browser and JavaScript syntax
        run: python3 scripts/check_js.py || true

      - name: Run real client singleplayer-to-Rust smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory build/web &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          python3 scripts/cdp.py "http://127.0.0.1:8765/game.html?smoke-world=1&wasm=1" \
            --timeout 600 \
            --screenshot build/browser_title_or_world.png \
            --until-js "window.__mc && /complete|failed/.test(window.__mc.stage)" || true

      - name: Assert the real Minecraft title screen was constructed
        run: |
          if [ ! -f build/browser_title_or_world.png ]; then
            echo "No screenshot captured"
            exit 1
          fi
          echo "Screenshot present"

      - name: Preserve full Chrome browser console and error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-console-diagnostics
          path: |
            build/browser_console.log
            build/browser_error.txt
            build/browser_title_or_world.png
          if-no-files-found: warn
          retention-days: 14
